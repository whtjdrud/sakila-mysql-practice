# 기본 조회: SELECT · WHERE · ORDER BY · LIMIT · DISTINCT
- id: SEL-001
  title: 전체 배우 이름 조회
  level: 1
  tags: [SELECT, ORDER BY]
  question: |
    모든 배우의 `actor_id`, `first_name`, `last_name` 을 `actor_id` 오름차순으로 조회하세요.

    **사용 테이블:** `actor`
  solution: |
    SELECT actor_id, first_name, last_name
    FROM actor
    ORDER BY actor_id;
  note: |
    가장 기본적인 조회입니다. `SELECT *` 대신 필요한 컬럼만 적는 습관을 들이세요.
    테이블 구조가 바뀌어도 쿼리 결과가 흔들리지 않고, 불필요한 데이터 전송도 줄어듭니다.

- id: SEL-002
  title: 특정 성을 가진 배우
  level: 1
  tags: [WHERE, "="]
  question: |
    성(`last_name`)이 `WAHLBERG` 인 배우의 `actor_id`, `first_name`, `last_name` 을 조회하세요.
    `actor_id` 오름차순.

    **사용 테이블:** `actor`
  solution: |
    SELECT actor_id, first_name, last_name
    FROM actor
    WHERE last_name = 'WAHLBERG'
    ORDER BY actor_id;
  note: |
    MySQL 의 기본 콜레이션(`utf8mb4_0900_ai_ci`)은 대소문자를 구분하지 않으므로
    `'wahlberg'` 로 비교해도 같은 결과가 나옵니다. 다른 DBMS 에서는 다를 수 있으니 주의하세요.

- id: SEL-003
  title: 비싸고 긴 영화
  level: 1
  tags: [WHERE, 숫자 비교]
  question: |
    대여료(`rental_rate`)가 4.99 인 영화 중 상영 시간(`length`)이 180분 이상인 영화의
    `title`, `length` 를 조회하세요. `length` 내림차순, 같으면 `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, length
    FROM film
    WHERE rental_rate = 4.99
      AND length >= 180
    ORDER BY length DESC, title;
  note: |
    `AND` 로 조건을 결합합니다. `rental_rate` 는 `DECIMAL(4,2)` 라서 `= 4.99` 비교가 정확하게 동작합니다.
    (FLOAT 였다면 부동소수점 오차 때문에 `=` 비교가 위험합니다.)

- id: SEL-004
  title: 등급 목록 중복 제거
  level: 1
  tags: [DISTINCT]
  question: |
    영화 테이블에 존재하는 관람 등급(`rating`)의 종류를 중복 없이 조회하세요. `rating` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT DISTINCT rating
    FROM film
    ORDER BY rating;
  note: |
    `rating` 은 `ENUM('G','PG','PG-13','R','NC-17')` 타입입니다.
    ENUM 을 `ORDER BY` 하면 **문자열 순서가 아니라 정의된 순서(인덱스)** 로 정렬됩니다.
    그래서 결과가 알파벳 순(G, NC-17, PG ...)이 아니라 G → PG → PG-13 → R → NC-17 로 나옵니다.

- id: SEL-005
  title: 가장 긴 영화 5편
  level: 1
  tags: [ORDER BY, LIMIT]
  question: |
    상영 시간(`length`)이 가장 긴 영화 5편의 `title`, `length` 를 조회하세요.
    `length` 내림차순, 같으면 `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, length
    FROM film
    ORDER BY length DESC, title
    LIMIT 5;
  note: |
    최대 상영 시간은 185분이고 이 길이의 영화가 5편보다 많습니다.
    따라서 2차 정렬(`title`)이 없으면 어떤 5편이 나올지 **보장되지 않습니다.** `LIMIT` 을 쓸 때는 항상 정렬을 끝까지 정하세요.

- id: SEL-006
  title: 이름이 J로 시작하는 배우
  level: 1
  tags: [LIKE, 와일드카드]
  question: |
    이름(`first_name`)이 `J` 로 시작하는 배우의 `first_name`, `last_name` 을 조회하세요.
    `first_name`, `last_name` 오름차순.

    **사용 테이블:** `actor`
  solution: |
    SELECT first_name, last_name
    FROM actor
    WHERE first_name LIKE 'J%'
    ORDER BY first_name, last_name;
  note: |
    `%` 는 0글자 이상, `_` 는 정확히 1글자를 뜻합니다.
    `LIKE 'J%'` 처럼 **앞부분이 고정된 패턴**은 인덱스를 탈 수 있지만, `'%J'` 처럼 앞이 와일드카드면 인덱스를 쓰지 못합니다.

- id: SEL-007
  title: 제목에 특정 단어가 들어간 영화
  level: 1
  tags: [LIKE]
  question: |
    제목(`title`)에 `LOVE` 가 들어가는 영화의 `film_id`, `title` 을 `film_id` 순으로 조회하세요.

    **사용 테이블:** `film`
  solution: |
    SELECT film_id, title
    FROM film
    WHERE title LIKE '%LOVE%'
    ORDER BY film_id;
  note: |
    양쪽에 `%` 를 붙이면 "포함" 검색입니다. 단어 경계를 따지지 않으므로 `GLOVE`, `LOVELY` 같은 제목도 함께 잡힙니다.
    단어 단위로 찾으려면 `REGEXP '\\bLOVE\\b'` 나 FULLTEXT 인덱스(`film_text` 테이블)를 검토하세요.

- id: SEL-008
  title: 여러 등급 중 하나
  level: 1
  tags: [IN]
  question: |
    등급이 `G` 또는 `PG` 이고 대여료가 0.99 인 영화의 `title`, `rating` 을 조회하세요.
    `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, rating
    FROM film
    WHERE rating IN ('G', 'PG')
      AND rental_rate = 0.99
    ORDER BY title;
  note: |
    `IN (...)` 은 `rating = 'G' OR rating = 'PG'` 와 같습니다.
    `OR` 를 직접 쓰면 `AND` 와 섞일 때 괄호를 빠뜨리기 쉬운데, `IN` 은 그런 실수를 막아 줍니다.

- id: SEL-009
  title: 범위 조건 BETWEEN
  level: 1
  tags: [BETWEEN]
  question: |
    교체 비용(`replacement_cost`)이 10.00 이상 12.00 이하인 영화의 `title`, `replacement_cost` 를 조회하세요.
    `replacement_cost` 오름차순, 같으면 `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, replacement_cost
    FROM film
    WHERE replacement_cost BETWEEN 10.00 AND 12.00
    ORDER BY replacement_cost, title;
  note: |
    `BETWEEN a AND b` 는 **양 끝을 포함**합니다 (`>= a AND <= b`).
    날짜/시간 컬럼에 `BETWEEN '2005-05-01' AND '2005-05-31'` 을 쓰면 31일 00:00:00 이후 데이터가 빠지는 함정이 있습니다.

- id: SEL-010
  title: 반납되지 않은 대여
  level: 1
  tags: [IS NULL]
  question: |
    아직 반납되지 않은(`return_date` 가 NULL) 대여 기록의 `rental_id`, `rental_date`, `customer_id` 를
    `rental_id` 순으로 조회하세요.

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id, rental_date, customer_id
    FROM rental
    WHERE return_date IS NULL
    ORDER BY rental_id;
  note: |
    NULL 은 `= NULL` 로 비교할 수 없습니다. `NULL = NULL` 의 결과도 TRUE 가 아니라 **NULL(알 수 없음)** 이기 때문입니다.
    반드시 `IS NULL` / `IS NOT NULL` 을 사용하세요. 결과는 총 183건입니다.

- id: SEL-011
  title: 비활성 고객
  level: 1
  tags: [WHERE, 불리언]
  question: |
    비활성(`active = 0`) 고객의 `customer_id`, `first_name`, `last_name`, `store_id` 를 `customer_id` 순으로 조회하세요.

    **사용 테이블:** `customer`
  solution: |
    SELECT customer_id, first_name, last_name, store_id
    FROM customer
    WHERE active = 0
    ORDER BY customer_id;
  note: |
    MySQL 의 BOOLEAN 은 사실 `TINYINT(1)` 입니다. `WHERE NOT active` 나 `WHERE active = FALSE` 도 같은 결과를 냅니다.

- id: SEL-012
  title: 특정 기간의 대여
  level: 2
  tags: [날짜 범위, 반열린 구간]
  question: |
    2005년 5월 25일 하루 동안 발생한 대여의 `rental_id`, `rental_date` 를 조회하세요.
    `rental_date`, `rental_id` 순 정렬.

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id, rental_date
    FROM rental
    WHERE rental_date >= '2005-05-25'
      AND rental_date <  '2005-05-26'
    ORDER BY rental_date, rental_id;
  note: |
    날짜 범위는 **반열린 구간 `[시작, 다음날)`** 으로 쓰는 것이 정석입니다.
    `DATE(rental_date) = '2005-05-25'` 도 결과는 같지만, 컬럼에 함수를 씌우면 인덱스를 사용할 수 없어 대용량에서 느려집니다.

- id: SEL-013
  title: 특별 부록에 예고편이 있는 영화
  level: 2
  tags: [SET 타입, FIND_IN_SET]
  question: |
    `special_features` 에 `Trailers` 가 포함된 영화 중 상영 시간이 50분 미만인 영화의
    `title`, `length`, `special_features` 를 조회하세요. `length`, `title` 순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, length, special_features
    FROM film
    WHERE FIND_IN_SET('Trailers', special_features) > 0
      AND length < 50
    ORDER BY length, title;
  note: |
    `special_features` 는 `SET` 타입이라 여러 값이 쉼표로 저장됩니다.
    `LIKE '%Trailers%'` 도 동작하지만, 값 하나가 다른 값의 부분 문자열일 때 오작동할 수 있어 `FIND_IN_SET` 이 더 정확합니다.

- id: SEL-014
  title: 복합 조건과 괄호
  level: 2
  tags: [AND, OR, 연산자 우선순위]
  question: |
    다음 조건을 만족하는 영화의 `title`, `rating`, `rental_rate` 를 조회하세요.

    - 등급이 `R` 또는 `NC-17` 이면서
    - 대여료가 0.99 **이거나** 상영 시간이 60분 미만

    `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, rating, rental_rate
    FROM film
    WHERE rating IN ('R', 'NC-17')
      AND (rental_rate = 0.99 OR length < 60)
    ORDER BY title;
  note: |
    `AND` 가 `OR` 보다 우선순위가 높습니다. 괄호를 빼고
    `rating IN (...) AND rental_rate = 0.99 OR length < 60` 이라고 쓰면
    "(R/NC-17 이고 0.99) 또는 (등급 무관 60분 미만)" 이 되어 결과가 훨씬 많아집니다.

- id: SEL-015
  title: 제외 조건 NOT IN
  level: 2
  tags: [NOT IN, NOT LIKE]
  question: |
    등급이 `G`, `PG`, `PG-13` 이 **아니고**, 제목이 `A` 로 시작하지 않으며,
    상영 시간이 180분 이상인 영화의 `title`, `rating`, `length` 를 조회하세요. `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, rating, length
    FROM film
    WHERE rating NOT IN ('G', 'PG', 'PG-13')
      AND title NOT LIKE 'A%'
      AND length >= 180
    ORDER BY title;
  note: |
    `NOT IN` 은 목록에 **NULL 이 섞이면 아무 행도 반환하지 않는** 함정이 있습니다.
    여기처럼 상수 목록이면 안전하지만, 서브쿼리와 함께 쓸 때는 `NOT EXISTS` 를 권장합니다.

- id: SEL-016
  title: 페이지네이션
  level: 2
  tags: [LIMIT, OFFSET, 페이징]
  question: |
    고객을 `last_name`, `first_name`, `customer_id` 순으로 정렬했을 때,
    한 페이지에 10명씩 보여준다면 **3페이지**에 해당하는 고객의 `customer_id`, `first_name`, `last_name` 을 조회하세요.

    **사용 테이블:** `customer`
  solution: |
    SELECT customer_id, first_name, last_name
    FROM customer
    ORDER BY last_name, first_name, customer_id
    LIMIT 10 OFFSET 20;
  note: |
    3페이지는 21~30번째 행이므로 `OFFSET (3-1)*10 = 20` 입니다. `LIMIT 20, 10` 으로도 쓸 수 있습니다.
    OFFSET 이 커지면 앞의 행을 모두 읽고 버리므로 느려집니다. 대용량에서는 "마지막으로 본 키보다 큰 것"을 조회하는 **키셋 페이지네이션**을 씁니다.

- id: SEL-017
  title: 계산 컬럼과 별칭
  level: 2
  tags: [산술 연산, 별칭]
  question: |
    각 영화의 "하루당 대여료"(`rental_rate / rental_duration`)를 소수 둘째 자리로 반올림해 `daily_rate` 로 구하고,
    `daily_rate` 가 가장 높은 영화 10편의 `title`, `rental_rate`, `rental_duration`, `daily_rate` 를 조회하세요.
    `daily_rate` 내림차순, 같으면 `title` 오름차순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, rental_rate, rental_duration,
           ROUND(rental_rate / rental_duration, 2) AS daily_rate
    FROM film
    ORDER BY daily_rate DESC, title
    LIMIT 10;
  note: |
    `ORDER BY` 에서는 SELECT 의 별칭(`daily_rate`)을 쓸 수 있습니다.
    반면 `WHERE` 는 SELECT 보다 **먼저** 실행되므로 별칭을 쓸 수 없습니다. (논리적 실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT)

- id: SEL-018
  title: 다중 정렬 방향
  level: 2
  tags: [ORDER BY, ASC, DESC]
  question: |
    2005-08-23 이후(해당 일 포함) 결제 중 금액이 10 이상인 결제의 `payment_id`, `customer_id`, `amount`, `payment_date` 를
    금액 내림차순, 결제 일시 오름차순, `payment_id` 오름차순으로 조회하세요.

    **사용 테이블:** `payment`
  solution: |
    SELECT payment_id, customer_id, amount, payment_date
    FROM payment
    WHERE payment_date >= '2005-08-23'
      AND amount >= 10
    ORDER BY amount DESC, payment_date, payment_id;
  note: |
    정렬 방향은 컬럼마다 따로 지정합니다. `ORDER BY a, b DESC` 는 a 오름차순, b 내림차순입니다.
    (`DESC` 가 앞의 컬럼까지 적용되지 않습니다.)

- id: SEL-019
  title: NULL 이 섞인 정렬
  level: 2
  tags: [NULL 정렬, IS NULL]
  question: |
    고객 1번(`customer_id = 1`)의 대여 기록에서 `rental_id`, `rental_date`, `return_date` 를 조회하되,
    **반납일이 늦은 순**으로 정렬하고 NULL(미반납)은 **맨 앞**에 오게 하세요. 같으면 `rental_id` 순.

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id, rental_date, return_date
    FROM rental
    WHERE customer_id = 1
    ORDER BY return_date IS NULL DESC, return_date DESC, rental_id;
  note: |
    MySQL 은 오름차순에서 NULL 을 **가장 작은 값**으로 취급해 맨 앞에, 내림차순에서는 맨 뒤에 둡니다.
    `NULLS FIRST` 문법이 없으므로 `컬럼 IS NULL` (참=1, 거짓=0) 을 정렬 키로 추가하는 기법을 씁니다.
    고객 1번은 미반납이 없어 순수하게 반납일 내림차순으로 나옵니다 — 다른 고객 번호로도 바꿔 실험해 보세요.

- id: SEL-020
  title: 정규식 검색
  level: 3
  tags: [REGEXP]
  question: |
    성(`last_name`)이 모음(A, E, I, O, U)으로 시작하고 모음으로 끝나는 배우의 `first_name`, `last_name` 을 조회하세요.
    `last_name`, `first_name` 순.

    **사용 테이블:** `actor`
  solution: |
    SELECT first_name, last_name
    FROM actor
    WHERE last_name REGEXP '^[AEIOU].*[AEIOU]$'
    ORDER BY last_name, first_name;
  note: |
    `^` 는 시작, `$` 는 끝, `[AEIOU]` 는 문자 집합, `.*` 는 임의 문자 0개 이상입니다.
    LIKE 로는 "모음 중 하나" 같은 조건을 표현하기 어려워 `REGEXP` 가 유용합니다. 다만 인덱스는 사용할 수 없습니다.

- id: SEL-021
  title: 지역·우편번호 조합 중복 제거
  level: 2
  tags: [DISTINCT, 다중 컬럼]
  question: |
    고객이 사는 주소(`address`) 테이블에서 `district` 가 `California` 이거나 `Texas` 인 주소의
    `district`, `postal_code` 조합을 중복 없이 조회하세요. `district`, `postal_code` 순.

    **사용 테이블:** `address`
  solution: |
    SELECT DISTINCT district, postal_code
    FROM address
    WHERE district IN ('California', 'Texas')
    ORDER BY district, postal_code;
  note: |
    `DISTINCT` 는 **SELECT 목록 전체의 조합**에 대해 중복을 제거합니다. 첫 번째 컬럼에만 적용되는 것이 아닙니다.

- id: SEL-022
  title: 빈 문자열과 NULL 구분
  level: 3
  tags: [NULL, 빈 문자열, COALESCE]
  question: |
    `address` 테이블에서 `address2` 가 **NULL 이거나 빈 문자열**인 주소가 각각 몇 개인지,
    그리고 실제 값이 있는 주소는 몇 개인지 한 행으로 구하세요.

    - 출력 컬럼: `null_cnt`, `empty_cnt`, `filled_cnt`

    **사용 테이블:** `address`
  solution: |
    SELECT SUM(address2 IS NULL)              AS null_cnt,
           SUM(address2 = '')                 AS empty_cnt,
           SUM(address2 IS NOT NULL AND address2 <> '') AS filled_cnt
    FROM address;
  note: |
    MySQL 에서 비교식은 1/0 을 돌려주므로 `SUM(조건)` 으로 조건별 개수를 셀 수 있습니다.
    `address2 = ''` 는 address2 가 NULL 인 행에서 NULL 이 되고, `SUM` 은 NULL 을 무시합니다.
    실무 데이터에는 NULL 과 빈 문자열이 섞여 있는 경우가 많아 둘을 구분해서 확인하는 습관이 중요합니다.
