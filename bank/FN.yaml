# 함수: 문자열 · 숫자 · 날짜 · NULL 처리
- id: FN-001
  title: 이름 합치기
  level: 1
  tags: [CONCAT]
  question: |
    배우의 이름과 성을 공백으로 이어 `full_name` 으로 만들고, `actor_id` 1~10번 배우의 `actor_id`, `full_name` 을 조회하세요.
    `actor_id` 순.

    **사용 테이블:** `actor`
  solution: |
    SELECT actor_id, CONCAT(first_name, ' ', last_name) AS full_name
    FROM actor
    WHERE actor_id BETWEEN 1 AND 10
    ORDER BY actor_id;
  note: |
    `CONCAT` 은 인자 중 하나라도 NULL 이면 **전체 결과가 NULL** 이 됩니다.
    NULL 을 건너뛰고 싶다면 `CONCAT_WS(' ', first_name, last_name)` 을 사용하세요. (구분자를 첫 인자로 받고 NULL 은 무시)

- id: FN-002
  title: 대소문자 변환과 이니셜
  level: 1
  tags: [LOWER, UPPER, LEFT]
  question: |
    고객 `customer_id` 1~5번에 대해 `customer_id`, 이름을 소문자로 바꾼 `first_lower`,
    이니셜(`이름첫글자.성첫글자.` 예: `M.S.`)인 `initials` 를 조회하세요. `customer_id` 순.

    **사용 테이블:** `customer`
  solution: |
    SELECT customer_id,
           LOWER(first_name) AS first_lower,
           CONCAT(LEFT(first_name, 1), '.', LEFT(last_name, 1), '.') AS initials
    FROM customer
    WHERE customer_id <= 5
    ORDER BY customer_id;
  note: |
    `LEFT(s, n)` 은 앞에서 n글자, `RIGHT(s, n)` 은 뒤에서 n글자를 잘라냅니다. `SUBSTRING(s, 1, n)` 과 같습니다.

- id: FN-003
  title: 가장 긴 영화 제목
  level: 1
  tags: [CHAR_LENGTH, LENGTH]
  question: |
    제목 글자 수가 가장 긴 영화 5편의 `title`, `title_len` 을 조회하세요. 글자 수 내림차순, 같으면 `title` 순.

    **사용 테이블:** `film`
  solution: |
    SELECT title, CHAR_LENGTH(title) AS title_len
    FROM film
    ORDER BY title_len DESC, title
    LIMIT 5;
  note: |
    `CHAR_LENGTH` 는 **문자 수**, `LENGTH` 는 **바이트 수**입니다. 영문은 같지만 한글(utf8mb4 에서 3바이트)은 다릅니다.
    `SELECT LENGTH('가'), CHAR_LENGTH('가')` → `3, 1`

- id: FN-004
  title: 이메일 도메인 추출
  level: 2
  tags: [SUBSTRING_INDEX]
  question: |
    고객 이메일에서 `@` 앞부분(아이디)과 뒷부분(도메인)을 분리해 `customer_id` 1~5번의
    `customer_id`, `email`, `user_part`, `domain` 을 조회하세요. `customer_id` 순.

    **사용 테이블:** `customer`
  solution: |
    SELECT customer_id, email,
           SUBSTRING_INDEX(email, '@', 1)  AS user_part,
           SUBSTRING_INDEX(email, '@', -1) AS domain
    FROM customer
    WHERE customer_id <= 5
    ORDER BY customer_id;
  note: |
    `SUBSTRING_INDEX(s, 구분자, n)` 은 n 이 양수면 **앞에서 n번째 구분자 이전**, 음수면 **뒤에서 n번째 구분자 이후**를 돌려줍니다.
    `LOCATE('@', email)` 로 위치를 찾아 `SUBSTRING` 으로 자르는 방법보다 간결합니다.

- id: FN-005
  title: 문자열 치환과 위치 찾기
  level: 2
  tags: [REPLACE, LOCATE]
  question: |
    영화 설명(`description`)에서 단어 `Drama` 를 `**DRAMA**` 로 치환한 `new_desc` 와,
    `Drama` 의 시작 위치 `pos` 를 구하세요.
    `Drama` 가 포함된 영화 중 `film_id` 가 작은 5편만, `film_id`, `pos`, `new_desc` 를 조회하세요.

    **사용 테이블:** `film`
  solution: |
    SELECT film_id,
           LOCATE('Drama', description) AS pos,
           REPLACE(description, 'Drama', '**DRAMA**') AS new_desc
    FROM film
    WHERE description LIKE '%Drama%'
    ORDER BY film_id
    LIMIT 5;
  note: |
    `LOCATE(찾을것, 문자열)` 은 1부터 시작하는 위치를 돌려주고, 없으면 0 입니다. (`INSTR(문자열, 찾을것)` 은 인자 순서가 반대)
    `REPLACE` 는 **모든** 일치 항목을 바꾸고, 대소문자를 구분합니다.

- id: FN-006
  title: 자릿수 맞추기
  level: 2
  tags: [LPAD, CAST]
  question: |
    `film_id` 를 6자리 코드로 만들어 `F000001` 형식의 `film_code` 를 만드세요.
    `film_id` 1~5, 998~1000 번 영화의 `film_id`, `film_code`, `title` 을 `film_id` 순으로 조회하세요.

    **사용 테이블:** `film`
  solution: |
    SELECT film_id,
           CONCAT('F', LPAD(film_id, 6, '0')) AS film_code,
           title
    FROM film
    WHERE film_id <= 5 OR film_id >= 998
    ORDER BY film_id;
  note: |
    `LPAD(값, 길이, 채울문자)` 은 왼쪽을 채웁니다. 숫자는 자동으로 문자열로 변환됩니다.
    주의: 원래 값이 길이보다 길면 **잘립니다.** `LPAD(1234567, 6, '0')` → `'123456'`

- id: FN-007
  title: 반올림 · 올림 · 내림 · 버림
  level: 1
  tags: [ROUND, CEIL, FLOOR, TRUNCATE]
  question: |
    `film_id` 1~5번 영화의 `replacement_cost` 에 대해 다음을 구하세요.

    - `rounded`: 정수로 반올림, `ceiled`: 올림, `floored`: 내림, `truncated`: 소수 첫째 자리에서 버림

    출력: `film_id`, `replacement_cost`, `rounded`, `ceiled`, `floored`, `truncated` (`film_id` 순)

    **사용 테이블:** `film`
  solution: |
    SELECT film_id, replacement_cost,
           ROUND(replacement_cost)       AS rounded,
           CEIL(replacement_cost)        AS ceiled,
           FLOOR(replacement_cost)       AS floored,
           TRUNCATE(replacement_cost, 1) AS truncated
    FROM film
    WHERE film_id <= 5
    ORDER BY film_id;
  note: |
    양수에서는 `FLOOR` 와 `TRUNCATE(x, 0)` 이 같지만, **음수**에서는 다릅니다.
    `FLOOR(-1.5) = -2`, `TRUNCATE(-1.5, 0) = -1`.

- id: FN-008
  title: 홀짝 구분
  level: 1
  tags: [MOD, "%"]
  question: |
    `actor_id` 가 7의 배수인 배우의 `actor_id`, `first_name`, `last_name` 을 `actor_id` 순으로 조회하세요.

    **사용 테이블:** `actor`
  solution: |
    SELECT actor_id, first_name, last_name
    FROM actor
    WHERE MOD(actor_id, 7) = 0
    ORDER BY actor_id;
  note: |
    `MOD(a, b)`, `a % b`, `a MOD b` 모두 같은 나머지 연산입니다. 데이터를 N개 그룹으로 나눌 때(샘플링, 샤딩)도 자주 씁니다.

- id: FN-009
  title: 날짜 형식 바꾸기
  level: 1
  tags: [DATE_FORMAT]
  question: |
    `rental_id` 1~5번 대여의 `rental_id` 와 대여일을 `2005년 05월 24일 (Tue) 22:53` 형식으로 바꾼 `rented_at` 을 조회하세요.

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id,
           DATE_FORMAT(rental_date, '%Y년 %m월 %d일 (%a) %H:%i') AS rented_at
    FROM rental
    WHERE rental_id <= 5
    ORDER BY rental_id;
  note: |
    자주 쓰는 지정자: `%Y` 4자리 연도, `%m` 2자리 월, `%d` 일, `%H` 24시, `%i` **분**(`%m` 이 아님!), `%s` 초, `%a` 요일 약어, `%W` 요일 전체.

- id: FN-010
  title: 요일별 대여 건수
  level: 2
  tags: [DAYNAME, DAYOFWEEK, GROUP BY]
  question: |
    요일별 대여 건수를 구하세요. 출력: `dow`(1=일요일 … 7=토요일), `day_name`, `rentals`. `dow` 순.

    **사용 테이블:** `rental`
  solution: |
    SELECT DAYOFWEEK(rental_date) AS dow,
           DAYNAME(rental_date)   AS day_name,
           COUNT(*)               AS rentals
    FROM rental
    GROUP BY dow, day_name
    ORDER BY dow;
  note: |
    `DAYOFWEEK` 는 일요일=1, `WEEKDAY` 는 월요일=0 입니다. 요일 **이름**으로 정렬하면 알파벳 순(Friday, Monday…)이 되므로 숫자로 정렬하세요.

- id: FN-011
  title: 대여 기간 계산
  level: 2
  tags: [DATEDIFF, TIMESTAMPDIFF]
  question: |
    반납된 대여 중 `rental_id` 1~10번에 대해 `rental_id`, 대여~반납 사이의 일수 `days`(날짜 차이), 시간 `hours` 를 구하세요.
    `rental_id` 순.

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id,
           DATEDIFF(return_date, rental_date)              AS days,
           TIMESTAMPDIFF(HOUR, rental_date, return_date)  AS hours
    FROM rental
    WHERE rental_id <= 10
      AND return_date IS NOT NULL
    ORDER BY rental_id;
  note: |
    `DATEDIFF` 는 **시간을 버리고 날짜만** 비교합니다. 23:59 에 빌려 다음날 00:01 에 반납해도 1일입니다.
    `TIMESTAMPDIFF(단위, 시작, 끝)` 는 인자 순서가 DATEDIFF 와 **반대**(시작이 먼저)라는 점에 주의하세요.

- id: FN-012
  title: 반납 예정일 계산
  level: 2
  tags: [DATE_ADD, INTERVAL]
  question: |
    대여 1~5번에 대해 영화의 대여 기간(`film.rental_duration` 일)을 더한 반납 예정일 `due_date` 를 구하세요.
    출력: `rental_id`, `rental_date`, `rental_duration`, `due_date` (`rental_id` 순)

    **사용 테이블:** `rental`, `inventory`, `film`
  solution: |
    SELECT r.rental_id, r.rental_date, f.rental_duration,
           DATE_ADD(r.rental_date, INTERVAL f.rental_duration DAY) AS due_date
    FROM rental r
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id      = i.film_id
    WHERE r.rental_id <= 5
    ORDER BY r.rental_id;
  note: |
    `INTERVAL` 뒤에는 컬럼도 올 수 있습니다. `rental_date + INTERVAL 3 DAY` 처럼 연산자 형태로도 쓸 수 있습니다.

- id: FN-013
  title: 연체 여부 판정
  level: 3
  tags: [DATEDIFF, IF, 날짜 비교]
  question: |
    반납된 대여 전체에서, 대여 기간(`rental_duration`)보다 **늦게** 반납된(반납일 > 대여일 + 기간) 건수와 비율을 구하세요.

    - 출력: `total_returned`, `late_cnt`, `late_pct`(백분율, 소수 1자리)

    **사용 테이블:** `rental`, `inventory`, `film`
  solution: |
    SELECT COUNT(*) AS total_returned,
           SUM(r.return_date > r.rental_date + INTERVAL f.rental_duration DAY) AS late_cnt,
           ROUND(100 * AVG(r.return_date > r.rental_date + INTERVAL f.rental_duration DAY), 1) AS late_pct
    FROM rental r
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id      = i.film_id
    WHERE r.return_date IS NOT NULL;
  note: |
    `AVG(조건식)` 은 조건이 참인 비율입니다 (참=1, 거짓=0 의 평균). `SUM(조건)/COUNT(*)` 보다 짧고 의도가 드러납니다.
    "늦게"의 기준을 날짜 단위(`DATEDIFF > duration`)로 할지 시각 단위로 할지에 따라 값이 달라집니다 — 정의를 먼저 정하세요.

- id: FN-014
  title: NULL 을 기본값으로
  level: 1
  tags: [IFNULL, COALESCE]
  question: |
    고객 1~20번이 **2006년에** 대여한 기록을 조회하되, 반납일이 NULL 이면 `'미반납'` 으로 표시하세요.

    - 출력: `rental_id`, `customer_id`, `returned`(반납일 문자열 또는 '미반납') — `rental_id` 순

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id, customer_id,
           COALESCE(CAST(return_date AS CHAR), '미반납') AS returned
    FROM rental
    WHERE customer_id BETWEEN 1 AND 20
      AND rental_date >= '2006-01-01'
    ORDER BY rental_id;
  note: |
    `IFNULL(a, b)` 는 인자 2개, `COALESCE(a, b, c, ...)` 는 **처음으로 NULL 이 아닌 값**을 돌려주며 표준 SQL 입니다.
    날짜와 문자열을 섞으면 타입이 암묵 변환되므로 `CAST(... AS CHAR)` 로 명시하는 편이 안전합니다.

- id: FN-015
  title: 0으로 나누기 방지
  level: 2
  tags: [NULLIF, 나눗셈]
  question: |
    각 매장(`store_id`)별로 `active = 0` 고객 수 대비 `active = 1` 고객 수의 배율 `ratio`(소수 2자리)를 구하세요.
    비활성 고객이 0명일 경우 오류 대신 NULL 이 나와야 합니다.

    - 출력: `store_id`, `active_cnt`, `inactive_cnt`, `ratio` — `store_id` 순

    **사용 테이블:** `customer`
  solution: |
    SELECT store_id,
           SUM(active = 1) AS active_cnt,
           SUM(active = 0) AS inactive_cnt,
           ROUND(SUM(active = 1) / NULLIF(SUM(active = 0), 0), 2) AS ratio
    FROM customer
    GROUP BY store_id
    ORDER BY store_id;
  note: |
    `NULLIF(a, b)` 는 a = b 이면 NULL, 아니면 a 를 돌려줍니다. 분모에 `NULLIF(x, 0)` 을 씌우는 것은 0 나눗셈 방지의 관용구입니다.
    (MySQL 은 기본 설정에서 0으로 나누면 NULL 을 주지만, 엄격 모드나 다른 DBMS 에서는 오류가 납니다.)

- id: FN-016
  title: 여러 값 중 최댓값
  level: 2
  tags: [GREATEST, LEAST]
  question: |
    `film_id` 1~10번 영화에 대해 `rental_rate * rental_duration`(기간 전체 대여료)과 `replacement_cost / 5` 중
    **큰 값**을 `price_floor` 로, **작은 값**을 `price_cap` 으로 구하세요 (둘 다 소수 2자리).

    - 출력: `film_id`, `price_floor`, `price_cap` — `film_id` 순

    **사용 테이블:** `film`
  solution: |
    SELECT film_id,
           ROUND(GREATEST(rental_rate * rental_duration, replacement_cost / 5), 2) AS price_floor,
           ROUND(LEAST(rental_rate * rental_duration, replacement_cost / 5), 2)    AS price_cap
    FROM film
    WHERE film_id <= 10
    ORDER BY film_id;
  note: |
    `MAX` 는 **여러 행** 중 최댓값(집계), `GREATEST` 는 **한 행 안의 여러 값** 중 최댓값입니다.
    인자 중 하나라도 NULL 이면 `GREATEST` 결과도 NULL 이 된다는 점에 주의하세요.

- id: FN-017
  title: 시간대별 결제
  level: 2
  tags: [HOUR, GROUP BY]
  question: |
    결제 시각의 **시(hour)** 별 결제 건수와 합계를 구하세요.

    - 출력: `hour`, `payments`, `total`(합계) — `hour` 순

    **사용 테이블:** `payment`
  solution: |
    SELECT HOUR(payment_date) AS hour,
           COUNT(*)           AS payments,
           SUM(amount)        AS total
    FROM payment
    GROUP BY hour
    ORDER BY hour;
  note: |
    `HOUR`, `MINUTE`, `SECOND`, `YEAR`, `MONTH`, `DAY` 처럼 날짜의 일부를 뽑는 함수는 `EXTRACT(HOUR FROM payment_date)` 표준 문법으로도 쓸 수 있습니다.

- id: FN-018
  title: 문자열을 날짜로
  level: 3
  tags: [STR_TO_DATE, 날짜 파싱]
  question: |
    `'24/05/2005'` 형식(일/월/연)의 문자열을 날짜로 변환해, 그 날짜에 발생한 대여 건수를 구하세요.
    파라미터처럼 문자열 리터럴을 변환해서 비교해야 합니다.

    - 출력: `target_date`, `rentals`

    **사용 테이블:** `rental`
  solution: |
    SELECT STR_TO_DATE('24/05/2005', '%d/%m/%Y') AS target_date,
           COUNT(*) AS rentals
    FROM rental
    WHERE rental_date >= STR_TO_DATE('24/05/2005', '%d/%m/%Y')
      AND rental_date <  STR_TO_DATE('24/05/2005', '%d/%m/%Y') + INTERVAL 1 DAY;
  note: |
    `STR_TO_DATE` 는 `DATE_FORMAT` 의 반대입니다. 형식이 맞지 않으면 NULL 을 돌려줍니다.
    컬럼이 아니라 **비교 값**을 변환했기 때문에 `rental_date` 의 인덱스를 그대로 사용할 수 있습니다.

- id: FN-019
  title: 월의 첫날과 마지막 날
  level: 3
  tags: [LAST_DAY, DATE_FORMAT, 월 단위]
  question: |
    대여가 발생한 각 달에 대해 그 달의 첫날 `month_start`, 마지막 날 `month_end`, 그 달의 대여 건수 `rentals` 를 구하세요.
    `month_start` 순.

    **사용 테이블:** `rental`
  solution: |
    SELECT DATE_FORMAT(rental_date, '%Y-%m-01') AS month_start,
           LAST_DAY(rental_date)                 AS month_end,
           COUNT(*)                              AS rentals
    FROM rental
    GROUP BY month_start, month_end
    ORDER BY month_start;
  note: |
    `LAST_DAY` 는 그 달의 마지막 날짜를 돌려줍니다. 월초는 `DATE_FORMAT(d, '%Y-%m-01')` 또는 `d - INTERVAL DAY(d)-1 DAY` 로 구합니다.
    월 단위 리포트의 기본 뼈대이며, 대여 기록이 있는 달이 5개뿐이라는 것도 확인할 수 있습니다.

- id: FN-020
  title: 고객 가입 후 경과 일수
  level: 2
  tags: [DATEDIFF, 기준일]
  question: |
    분석 기준일을 데이터의 마지막 대여일인 `'2006-02-14'` 로 할 때,
    고객 1~5번의 `customer_id`, `create_date`, 기준일까지 경과 일수 `days_since_join`,
    마지막 대여일로부터 기준일까지 경과 일수 `days_since_last_rental` 을 구하세요. `customer_id` 순.

    **사용 테이블:** `customer`, `rental`
  solution: |
    SELECT c.customer_id, c.create_date,
           DATEDIFF('2006-02-14', c.create_date) AS days_since_join,
           DATEDIFF('2006-02-14', MAX(r.rental_date)) AS days_since_last_rental
    FROM customer c
    JOIN rental r ON r.customer_id = c.customer_id
    WHERE c.customer_id <= 5
    GROUP BY c.customer_id, c.create_date
    ORDER BY c.customer_id;
  note: |
    Sakila 는 모든 고객의 가입일(`create_date`)이 **2006-02-14 22:04** 로 같고, 대여는 그보다 앞선 2005-05 부터 있습니다.
    그래서 `days_since_join` 이 모두 0 입니다 — "가입 전에 대여했다"는 비현실적인 샘플 데이터라는 뜻이죠.
    실무에서도 이런 이상값을 발견하면 컬럼의 의미(가입일인지, 데이터 이관일인지)부터 확인해야 합니다.
    또한 `NOW()` 대신 **고정 기준일**을 쓰면 언제 실행해도 같은 결과를 얻습니다.

- id: FN-021
  title: 금액 문자열 포맷
  level: 2
  tags: [FORMAT, CONCAT]
  question: |
    매장별 총 매출을 천 단위 쉼표와 소수 2자리가 들어간 문자열로 표시하세요. 예: `$12,345.67`

    - 출력: `store_id`, `revenue_text` — `store_id` 순
    - 매장은 결제를 처리한 직원의 `store_id` 기준

    **사용 테이블:** `payment`, `staff`
  solution: |
    SELECT s.store_id,
           CONCAT('$', FORMAT(SUM(p.amount), 2)) AS revenue_text
    FROM payment p
    JOIN staff s ON s.staff_id = p.staff_id
    GROUP BY s.store_id
    ORDER BY s.store_id;
  note: |
    `FORMAT(n, 소수자리)` 의 결과는 **문자열**입니다. 화면 표시용으로만 쓰고, 정렬·계산은 원래 숫자로 해야 합니다.
    문자열 `'9,000'` 과 `'10,000'` 을 정렬하면 `'10,000'` 이 먼저 옵니다.

- id: FN-022
  title: 제목 단어 수 세기
  level: 3
  tags: [CHAR_LENGTH, REPLACE, 문자열 트릭]
  question: |
    영화 제목의 단어 수(공백으로 구분)를 구하고, 단어 수별 영화 편수를 집계하세요.

    - 출력: `word_count`, `films` — `word_count` 순

    **사용 테이블:** `film`
  solution: |
    SELECT CHAR_LENGTH(title) - CHAR_LENGTH(REPLACE(title, ' ', '')) + 1 AS word_count,
           COUNT(*) AS films
    FROM film
    GROUP BY word_count
    ORDER BY word_count;
  note: |
    "전체 길이 − 공백을 지운 길이 = 공백 개수" 라는 고전적인 트릭입니다. 단어 수는 공백 수 + 1 입니다.
    결과는 단 1행 — Sakila 의 영화 제목 1,000개는 **전부 정확히 두 단어**입니다. 샘플 데이터가 "형용사/명사 + 명사" 규칙으로 자동 생성되었기 때문입니다.

- id: FN-023
  title: 형 변환과 비교 함정
  level: 3
  tags: [CAST, 암묵적 형 변환]
  question: |
    `postal_code` 는 문자열(VARCHAR) 컬럼입니다. 우편번호를 **숫자로 변환했을 때** 90000 이상 90999 이하인 주소의
    `address_id`, `postal_code`, `district` 를 조회하세요. `address_id` 순.

    **사용 테이블:** `address`
  solution: |
    SELECT address_id, postal_code, district
    FROM address
    WHERE CAST(postal_code AS UNSIGNED) BETWEEN 90000 AND 90999
    ORDER BY address_id;
  note: |
    문자열끼리 비교하면 사전 순이라 `'9' > '10000'` 이 됩니다. 숫자 범위로 비교하려면 명시적으로 `CAST` 하세요.
    `WHERE postal_code = 90000` 처럼 문자열 컬럼과 숫자를 비교하면 MySQL 이 **모든 행을 숫자로 변환**하므로 인덱스를 쓰지 못합니다.
