# 조건식 · 집합: CASE · 피벗 · UNION · INTERSECT · EXCEPT
- id: CASE-001
  title: 상영 시간 분류
  level: 1
  tags: [CASE WHEN]
  question: |
    영화를 상영 시간에 따라 `단편`(60분 미만), `보통`(60~119분), `장편`(120분 이상)으로 분류하고 분류별 편수를 구하세요.

    - 출력: `length_type`, `films` — 단편 → 보통 → 장편 순

    **사용 테이블:** `film`
  solution: |
    SELECT CASE WHEN length < 60  THEN '단편'
                WHEN length < 120 THEN '보통'
                ELSE '장편' END AS length_type,
           COUNT(*) AS films
    FROM film
    GROUP BY length_type
    ORDER BY MIN(length);
  note: |
    `CASE` 는 **위에서부터 처음 참인 조건**의 값을 돌려줍니다. 그래서 두 번째 조건에 `length >= 60 AND` 를 다시 쓸 필요가 없습니다.
    정렬 순서를 따로 지정하는 대신 `ORDER BY MIN(length)` 로 그룹의 자연스러운 순서를 이용했습니다.

- id: CASE-002
  title: 등급을 한국어로
  level: 1
  tags: [단순 CASE]
  question: |
    등급별 영화 수를 구하되 등급을 한국 기준 설명으로 바꿔 표시하세요.

    | rating | 설명 |
    |---|---|
    | G | 전체관람가 |
    | PG, PG-13 | 12세 이상 |
    | R | 15세 이상 |
    | NC-17 | 청소년 관람불가 |

    - 출력: `rating_kr`, `films` — `films` 내림차순, `rating_kr` 순

    **사용 테이블:** `film`
  solution: |
    SELECT CASE rating
             WHEN 'G'     THEN '전체관람가'
             WHEN 'PG'    THEN '12세 이상'
             WHEN 'PG-13' THEN '12세 이상'
             WHEN 'R'     THEN '15세 이상'
             WHEN 'NC-17' THEN '청소년 관람불가'
           END AS rating_kr,
           COUNT(*) AS films
    FROM film
    GROUP BY rating_kr
    ORDER BY films DESC, rating_kr;
  note: |
    `CASE 컬럼 WHEN 값 THEN ...` 형태를 **단순 CASE** 라 합니다. 등호 비교만 할 때 간결합니다.
    `ELSE` 를 생략하면 어느 조건에도 맞지 않는 값은 NULL 이 됩니다.

- id: CASE-003
  title: 임의 순서로 정렬하기
  level: 2
  tags: [ORDER BY CASE]
  question: |
    장르 `Action`, `Comedy`, `Drama` 를 **이 순서대로 맨 위에**, 나머지 장르는 그 아래에 이름 순으로 정렬해 모든 장르의 `name` 을 조회하세요.

    **사용 테이블:** `category`
  solution: |
    SELECT name
    FROM category
    ORDER BY CASE name
               WHEN 'Action' THEN 1
               WHEN 'Comedy' THEN 2
               WHEN 'Drama'  THEN 3
               ELSE 4
             END,
             name;
  note: |
    `ORDER BY` 에도 CASE 를 쓸 수 있습니다. "추천 항목 먼저" 같은 비즈니스 정렬에 유용합니다.
    MySQL 전용 `FIELD()` 를 쓸 때는 목록에 없는 값이 0이 되어 **맨 앞**으로 오니 주의하세요.

- id: CASE-004
  title: 등급별 월간 대여 피벗
  level: 3
  tags: [피벗, 조건부 집계]
  question: |
    영화 등급을 행으로, 대여 월(2005-05 ~ 2005-08)을 열로 하는 대여 건수 피벗 표를 만드세요.

    - 출력: `rating`, `m05`, `m06`, `m07`, `m08`, `total` — `rating` 순

    **사용 테이블:** `rental`, `inventory`, `film`
  solution: |
    SELECT f.rating,
           SUM(MONTH(r.rental_date) = 5 AND YEAR(r.rental_date) = 2005) AS m05,
           SUM(MONTH(r.rental_date) = 6 AND YEAR(r.rental_date) = 2005) AS m06,
           SUM(MONTH(r.rental_date) = 7 AND YEAR(r.rental_date) = 2005) AS m07,
           SUM(MONTH(r.rental_date) = 8 AND YEAR(r.rental_date) = 2005) AS m08,
           COUNT(*) AS total
    FROM rental r
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id      = i.film_id
    GROUP BY f.rating
    ORDER BY f.rating;
  note: |
    MySQL 에는 `PIVOT` 문법이 없어 **조건부 집계**로 피벗합니다. 열 하나 = `SUM(CASE WHEN 조건 THEN 1 ELSE 0 END)`.
    `total` 은 2006-02 대여까지 포함하므로 m05~m08 합계와 다릅니다 — 의도한 것인지 항상 확인하세요.

- id: CASE-005
  title: 매장 × 장르 매출 피벗
  level: 3
  tags: [피벗, SUM CASE]
  question: |
    장르별로 1번 매장 매출 `store1`, 2번 매장 매출 `store2`, 차이 `diff`(store1 - store2)를 구하세요.
    매장은 결제를 처리한 직원의 매장 기준입니다. `diff` 내림차순, `category` 순.

    **사용 테이블:** `payment`, `staff`, `rental`, `inventory`, `film_category`, `category`
  solution: |
    SELECT c.name AS category,
           SUM(CASE WHEN s.store_id = 1 THEN p.amount ELSE 0 END) AS store1,
           SUM(CASE WHEN s.store_id = 2 THEN p.amount ELSE 0 END) AS store2,
           SUM(CASE WHEN s.store_id = 1 THEN p.amount ELSE -p.amount END) AS diff
    FROM payment p
    JOIN staff s          ON s.staff_id     = p.staff_id
    JOIN rental r         ON r.rental_id    = p.rental_id
    JOIN inventory i      ON i.inventory_id = r.inventory_id
    JOIN film_category fc ON fc.film_id     = i.film_id
    JOIN category c       ON c.category_id  = fc.category_id
    GROUP BY c.category_id, c.name
    ORDER BY diff DESC, category;
  note: |
    CASE 의 THEN 에 숫자 대신 **컬럼 값**(`p.amount`)을 넣으면 조건부 합계가 됩니다.
    차이를 `store1 - store2` 로 다시 계산하는 대신 부호를 바꿔 한 번에 더하는 트릭도 있습니다.

- id: CASE-006
  title: UNION 으로 연락처 목록 만들기
  level: 2
  tags: [UNION ALL]
  question: |
    고객과 직원을 하나의 연락처 목록으로 합치세요. 이메일이 `@` 앞 기준 `M` 으로 시작하는 사람만 포함합니다.

    - 출력: `type`(`고객`/`직원`), `name`(이름 성), `email` — `type`, `name` 순

    **사용 테이블:** `customer`, `staff`
  solution: |
    SELECT '고객' AS type, CONCAT(first_name, ' ', last_name) AS name, email
    FROM customer
    WHERE email LIKE 'M%'
    UNION ALL
    SELECT '직원', CONCAT(first_name, ' ', last_name), email
    FROM staff
    WHERE email LIKE 'M%'
    ORDER BY type, name;
  note: |
    `UNION` 은 두 결과를 위아래로 붙입니다. 컬럼 **개수와 순서**가 같아야 하고, 컬럼 이름은 **첫 번째 SELECT** 를 따릅니다.
    `ORDER BY` 는 마지막에 한 번만 쓰며 합쳐진 전체 결과에 적용됩니다.

- id: CASE-007
  title: UNION 과 UNION ALL 의 차이
  level: 2
  tags: [UNION, UNION ALL, 중복 제거]
  question: |
    배우의 이름(`first_name`)과 고객의 이름(`first_name`)을 합친 목록의 개수를 두 가지로 구하세요.

    - `union_all_cnt`: UNION ALL 결과 행 수
    - `union_cnt`: UNION 결과 행 수

    **사용 테이블:** `actor`, `customer`
  solution: |
    SELECT
      (SELECT COUNT(*) FROM (SELECT first_name FROM actor UNION ALL SELECT first_name FROM customer) a) AS union_all_cnt,
      (SELECT COUNT(*) FROM (SELECT first_name FROM actor UNION     SELECT first_name FROM customer) u) AS union_cnt;
  note: |
    `UNION` 은 **중복을 제거**(내부적으로 정렬/해시)하므로 느리고, `UNION ALL` 은 그대로 붙여 빠릅니다.
    `UNION` 은 두 집합 사이의 중복뿐 아니라 **한쪽 안의 중복**도 제거한다는 점에 주의하세요. 중복 제거가 필요 없다면 항상 UNION ALL 을 쓰세요.

- id: CASE-008
  title: 배우이면서 고객인 이름
  level: 2
  tags: [INTERSECT]
  question: |
    배우와 고객 **양쪽에 모두 존재하는** 이름(`first_name`, `last_name` 조합)을 `last_name`, `first_name` 순으로 조회하세요.

    **사용 테이블:** `actor`, `customer`
  solution: |
    SELECT first_name, last_name FROM actor
    INTERSECT
    SELECT first_name, last_name FROM customer
    ORDER BY last_name, first_name;
  note: |
    `INTERSECT`(교집합)와 `EXCEPT`(차집합)는 MySQL **8.0.31** 부터 지원됩니다. 이전 버전에서는 `IN`/`EXISTS` 로 풀어야 합니다.
    집합 연산은 NULL 끼리도 **같은 값으로 취급**한다는 점이 `=` 비교와 다릅니다.

- id: CASE-009
  title: 대여는 있지만 2006년엔 없는 고객
  level: 2
  tags: [EXCEPT]
  question: |
    2005년 8월에는 대여했지만 2006년에는 대여하지 않은 고객의 수를 `EXCEPT` 로 구하세요.

    - 출력: `customers`

    **사용 테이블:** `rental`
  solution: |
    SELECT COUNT(*) AS customers
    FROM (
        SELECT customer_id FROM rental
        WHERE rental_date >= '2005-08-01' AND rental_date < '2005-09-01'
        EXCEPT
        SELECT customer_id FROM rental
        WHERE rental_date >= '2006-01-01'
    ) t;
  note: |
    `A EXCEPT B` 는 A 에는 있고 B 에는 없는 행입니다. 결과는 자동으로 중복이 제거됩니다 (`EXCEPT ALL` 은 중복 유지).
    같은 문제를 `NOT EXISTS` 로도 풀어 보세요.

- id: CASE-010
  title: 이탈 위험 고객 분류
  level: 3
  tags: [CASE, 파생 테이블, 세그먼트]
  question: |
    고객별 마지막 대여일과 대여 횟수로 다음 세그먼트를 만들고 세그먼트별 고객 수와 평균 결제액(소수 2자리)을 구하세요.
    기준일은 2005년 마지막 대여 다음 날인 `'2005-08-24'` 이며 2006년 대여는 제외합니다.

    | 세그먼트 | 조건 |
    |---|---|
    | 충성 | 마지막 대여가 기준일 2일 이내 & 대여 30회 이상 |
    | 활동 | 마지막 대여가 기준일 2일 이내 |
    | 이탈위험 | 그 외 |

    - 출력: `segment`, `customers`, `avg_paid` — 충성 → 활동 → 이탈위험 순

    **사용 테이블:** `rental`, `payment`
  solution: |
    SELECT segment, COUNT(*) AS customers, ROUND(AVG(paid), 2) AS avg_paid
    FROM (
        SELECT r.customer_id,
               CASE WHEN MAX(r.rental_date) >= '2005-08-24' - INTERVAL 2 DAY AND COUNT(*) >= 30 THEN '충성'
                    WHEN MAX(r.rental_date) >= '2005-08-24' - INTERVAL 2 DAY THEN '활동'
                    ELSE '이탈위험' END AS segment,
               (SELECT SUM(p.amount) FROM payment p
                 WHERE p.customer_id = r.customer_id AND p.payment_date < '2006-01-01') AS paid
        FROM rental r
        WHERE r.rental_date < '2006-01-01'
        GROUP BY r.customer_id
    ) t
    GROUP BY segment
    ORDER BY FIELD(segment, '충성', '활동', '이탈위험');
  note: |
    CASE 안에서 집계 함수(`MAX`, `COUNT`)를 쓸 수 있습니다. **RFM 분석**(Recency·Frequency·Monetary)의 간단한 버전입니다.
    조건의 순서가 중요합니다 — `충성` 을 `활동` 보다 먼저 검사해야 합니다.
    기준일과 기간 설정이 지표를 좌우합니다. 기준일을 `'2005-09-01'` 로 잡으면 마지막 대여(08-23)가 7일 밖이라 **전원이 이탈위험**,
    `'2005-08-24'` 기준 7일이면 **전원이 활동**이 됩니다. 8월 하순 대여가 몰려 있어 2일 창(window)에서야 세 세그먼트가 고르게 나뉩니다.

- id: CASE-011
  title: NULL 을 포함한 CASE
  level: 2
  tags: [CASE, IS NULL]
  question: |
    대여를 반납 상태로 분류해 상태별 건수를 구하세요.

    | 상태 | 조건 |
    |---|---|
    | 미반납 | return_date 가 NULL |
    | 당일반납 | 대여일과 반납일이 같은 날 |
    | 기한내 | 대여 기간(`rental_duration`) 이내 |
    | 연체 | 그 외 |

    - 출력: `status`, `rentals` — 미반납 → 당일반납 → 기한내 → 연체 순

    **사용 테이블:** `rental`, `inventory`, `film`
  solution: |
    SELECT status, COUNT(*) AS rentals
    FROM (
        SELECT CASE WHEN r.return_date IS NULL THEN '미반납'
                    WHEN DATE(r.return_date) = DATE(r.rental_date) THEN '당일반납'
                    WHEN DATEDIFF(r.return_date, r.rental_date) <= f.rental_duration THEN '기한내'
                    ELSE '연체' END AS status
        FROM rental r
        JOIN inventory i ON i.inventory_id = r.inventory_id
        JOIN film f      ON f.film_id      = i.film_id
    ) t
    GROUP BY status
    ORDER BY FIELD(status, '미반납', '당일반납', '기한내', '연체');
  note: |
    NULL 검사는 **가장 먼저** 해야 합니다. `DATEDIFF(NULL, ...)` 은 NULL 이고 `NULL <= 3` 도 NULL(거짓 취급)이라
    NULL 검사를 빼먹으면 미반납이 `연체` 로 잘못 분류됩니다.

- id: CASE-012
  title: 가격 인상 시뮬레이션
  level: 3
  tags: [CASE, 시뮬레이션]
  question: |
    다음 규칙으로 대여료를 조정했을 때, 2005년 7월 결제가 조정 대여료로 이뤄졌다고 가정한 예상 매출을 구하세요.

    - 대여 횟수 상위 인기작(영화별 대여 30회 이상): +1.00
    - 등급 `NC-17`: +0.50 (인기작이면 인기작 규칙만 적용)
    - 그 외: 변동 없음

    출력: `actual`(실제 7월 대여료 합계 = 7월 대여 건수 × 원래 대여료), `simulated`(조정 후 합계), `uplift_pct`(소수 1자리)

    **사용 테이블:** `rental`, `inventory`, `film`
  solution: |
    SELECT SUM(f.rental_rate) AS actual,
           SUM(f.rental_rate + CASE WHEN pop.rentals >= 30 THEN 1.00
                                    WHEN f.rating = 'NC-17' THEN 0.50
                                    ELSE 0 END) AS simulated,
           ROUND(100 * (SUM(f.rental_rate + CASE WHEN pop.rentals >= 30 THEN 1.00
                                                 WHEN f.rating = 'NC-17' THEN 0.50
                                                 ELSE 0 END) / SUM(f.rental_rate) - 1), 1) AS uplift_pct
    FROM rental r
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id      = i.film_id
    JOIN (
        SELECT i.film_id, COUNT(*) AS rentals
        FROM rental r JOIN inventory i ON i.inventory_id = r.inventory_id
        GROUP BY i.film_id
    ) pop ON pop.film_id = f.film_id
    WHERE r.rental_date >= '2005-07-01' AND r.rental_date < '2005-08-01';
  note: |
    가격 정책 같은 **"만약 ~라면"** 시나리오를 CASE 로 빠르게 시뮬레이션할 수 있습니다.
    실제 결제(`payment.amount`)에는 연체료가 섞여 있어 대여료 효과만 보려면 `rental_rate` 기준으로 계산해야 합니다.

- id: CASE-013
  title: 요일 × 시간대 히트맵
  level: 3
  tags: [피벗, CASE, 시간대]
  question: |
    대여를 요일(행)과 시간대(열)로 교차 집계하세요. 시간대: `새벽`(0~5시), `오전`(6~11시), `오후`(12~17시), `저녁`(18~23시).

    - 출력: `dow`(1=일 … 7=토), `day_name`, `dawn`, `morning`, `afternoon`, `evening` — `dow` 순

    **사용 테이블:** `rental`
  solution: |
    SELECT DAYOFWEEK(rental_date) AS dow,
           DAYNAME(rental_date)   AS day_name,
           SUM(HOUR(rental_date) BETWEEN 0  AND 5)  AS dawn,
           SUM(HOUR(rental_date) BETWEEN 6  AND 11) AS morning,
           SUM(HOUR(rental_date) BETWEEN 12 AND 17) AS afternoon,
           SUM(HOUR(rental_date) BETWEEN 18 AND 23) AS evening
    FROM rental
    GROUP BY dow, day_name
    ORDER BY dow;
  note: |
    시각화 도구의 히트맵 입력 데이터를 SQL 로 바로 만드는 패턴입니다. 행 합계가 요일별 대여 수와 같은지 검산해 보세요.

- id: CASE-014
  title: 집합 연산 조합
  level: 4
  tags: [UNION, EXCEPT, INTERSECT, 우선순위]
  question: |
    다음 세 집합으로 결과를 구하세요 (모두 `film_id` 집합).

    - A: `Action` 장르 영화
    - B: `PENELOPE GUINESS` 출연작
    - C: 2번 매장에 재고가 있는 영화

    **(A ∪ B) − C** 에 속하는 영화의 `film_id`, `title` 을 `film_id` 순으로 조회하세요.

    **사용 테이블:** `film`, `film_category`, `category`, `film_actor`, `actor`, `inventory`
  solution: |
    SELECT f.film_id, f.title
    FROM film f
    WHERE f.film_id IN (
        (SELECT fc.film_id FROM film_category fc JOIN category c ON c.category_id = fc.category_id
          WHERE c.name = 'Action'
         UNION
         SELECT fa.film_id FROM film_actor fa JOIN actor a ON a.actor_id = fa.actor_id
          WHERE a.first_name = 'PENELOPE' AND a.last_name = 'GUINESS')
        EXCEPT
        SELECT i.film_id FROM inventory i WHERE i.store_id = 2
    )
    ORDER BY f.film_id;
  note: |
    표준 SQL 에서 `INTERSECT` 는 `UNION`/`EXCEPT` 보다 우선순위가 높고, `UNION` 과 `EXCEPT` 는 왼쪽부터 계산됩니다.
    의도를 분명히 하려면 **괄호**로 묶으세요. 집합 연산 결과를 `IN (...)` 안에 넣어 원래 테이블과 조인할 수 있습니다.

- id: CASE-015
  title: 매장별 신규 vs 재방문 비율
  level: 4
  tags: [CASE, 상관 서브쿼리, 비율]
  question: |
    2005년 7월 대여를 **그 고객의 첫 대여인지 여부**로 나눠, 매장(`inventory.store_id`)별 신규 대여 건수와 재방문 대여 건수, 신규 비율을 구하세요.

    - 출력: `store_id`, `first_time`, `returning`, `first_pct`(소수 2자리) — `store_id` 순

    **사용 테이블:** `rental`, `inventory`
  solution: |
    SELECT i.store_id,
           SUM(CASE WHEN r.rental_date = fr.first_date THEN 1 ELSE 0 END) AS first_time,
           SUM(CASE WHEN r.rental_date > fr.first_date THEN 1 ELSE 0 END) AS returning,
           ROUND(100 * AVG(r.rental_date = fr.first_date), 2) AS first_pct
    FROM rental r
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN (
        SELECT customer_id, MIN(rental_date) AS first_date
        FROM rental
        GROUP BY customer_id
    ) fr ON fr.customer_id = r.customer_id
    WHERE r.rental_date >= '2005-07-01' AND r.rental_date < '2005-08-01'
    GROUP BY i.store_id
    ORDER BY i.store_id;
  note: |
    599명 중 598명의 첫 대여가 2005년 5~6월이라, 7월 신규 대여는 **단 1건**(1번 매장)입니다.
    이처럼 0에 가까운 지표는 "왜 그런지" 를 데이터 기간과 함께 설명할 수 있어야 합니다. 기간을 5월로 바꿔 비교해 보세요.

- id: CASE-016
  title: 등급별 특별 부록 포함 여부 교차표
  level: 3
  tags: [피벗, FIND_IN_SET]
  question: |
    등급별로 각 특별 부록(`Trailers`, `Commentaries`, `Deleted Scenes`, `Behind the Scenes`)이 포함된 영화 비율(%)을 구하세요.

    - 출력: `rating`, `trailers`, `commentaries`, `deleted`, `behind` (모두 소수 1자리) — `rating` 순

    **사용 테이블:** `film`
  solution: |
    SELECT rating,
           ROUND(100 * AVG(FIND_IN_SET('Trailers', special_features) > 0), 1)          AS trailers,
           ROUND(100 * AVG(FIND_IN_SET('Commentaries', special_features) > 0), 1)      AS commentaries,
           ROUND(100 * AVG(FIND_IN_SET('Deleted Scenes', special_features) > 0), 1)    AS deleted,
           ROUND(100 * AVG(FIND_IN_SET('Behind the Scenes', special_features) > 0), 1) AS behind
    FROM film
    GROUP BY rating
    ORDER BY rating;
  note: |
    한 행에 여러 값이 들어간 컬럼(SET)도 조건부 평균으로 비율 피벗을 만들 수 있습니다.
    정규화된 설계라면 `film_feature(film_id, feature)` 같은 별도 테이블이 더 다루기 쉽습니다.

- id: CASE-017
  title: 언피벗 (열을 행으로)
  level: 3
  tags: [UNION ALL, 언피벗]
  question: |
    `film_id` 1~3번 영화의 `rental_rate`, `replacement_cost`, `length` 세 값을 **세로로** 펼치세요.

    - 출력: `film_id`, `metric`(컬럼명), `value` — `film_id`, `metric` 순

    **사용 테이블:** `film`
  solution: |
    SELECT film_id, 'length' AS metric, length AS value FROM film WHERE film_id <= 3
    UNION ALL
    SELECT film_id, 'rental_rate', rental_rate FROM film WHERE film_id <= 3
    UNION ALL
    SELECT film_id, 'replacement_cost', replacement_cost FROM film WHERE film_id <= 3
    ORDER BY film_id, metric;
  note: |
    피벗의 반대인 **언피벗**은 UNION ALL 로 열마다 SELECT 를 붙여 만듭니다. 차트 도구나 롱 포맷 데이터가 필요할 때 씁니다.
    UNION 결과 컬럼의 타입은 모든 SELECT 를 아우르는 타입으로 정해집니다(여기서는 DECIMAL).

- id: CASE-018
  title: 월별 신규·유지·이탈 고객
  level: 5
  tags: [UNION ALL, EXISTS, 고객 흐름]
  question: |
    2005-06 ~ 2005-08 각 달에 대해 고객 흐름을 구하세요.

    - `신규`: 이번 달 대여했고, 이전 달까지 대여 기록이 없음
    - `유지`: 이번 달과 직전 달 모두 대여
    - `복귀`: 이번 달 대여, 직전 달은 없지만 그 이전에는 있음
    - `이탈`: 직전 달 대여했지만 이번 달은 없음

    출력: `month`(YYYY-MM-01), `flow`, `customers` — `month`, 신규 → 유지 → 복귀 → 이탈 순

    **사용 테이블:** `rental`
  solution: |
    SELECT month, flow, COUNT(*) AS customers
    FROM (
        SELECT m.month, a.customer_id,
               CASE WHEN NOT EXISTS (SELECT 1 FROM rental r WHERE r.customer_id = a.customer_id AND r.rental_date < m.month)
                         THEN '신규'
                    WHEN EXISTS (SELECT 1 FROM rental r WHERE r.customer_id = a.customer_id
                                   AND r.rental_date >= m.month - INTERVAL 1 MONTH AND r.rental_date < m.month)
                         THEN '유지'
                    ELSE '복귀' END AS flow
        FROM (SELECT DATE('2005-06-01') AS month UNION ALL SELECT '2005-07-01' UNION ALL SELECT '2005-08-01') m
        JOIN (SELECT DISTINCT customer_id, DATE_FORMAT(rental_date, '%Y-%m-01') AS month FROM rental) a
          ON a.month = m.month
        UNION ALL
        SELECT m.month, p.customer_id, '이탈'
        FROM (SELECT DATE('2005-06-01') AS month UNION ALL SELECT '2005-07-01' UNION ALL SELECT '2005-08-01') m
        JOIN (SELECT DISTINCT customer_id, DATE_FORMAT(rental_date, '%Y-%m-01') AS month FROM rental) p
          ON p.month = m.month - INTERVAL 1 MONTH
        WHERE NOT EXISTS (SELECT 1 FROM rental r WHERE r.customer_id = p.customer_id
                            AND r.rental_date >= m.month AND r.rental_date < m.month + INTERVAL 1 MONTH)
    ) t
    GROUP BY month, flow
    ORDER BY month, FIELD(flow, '신규', '유지', '복귀', '이탈');
  note: |
    이번 달 활동 고객(신규/유지/복귀)과 지난달 활동했지만 이번 달 없는 고객(이탈)은 **출발 집합이 달라서** 하나의 CASE 로 표현할 수 없습니다.
    그래서 두 결과를 `UNION ALL` 로 합쳤습니다. 검산: (지난달 활동 고객) = 유지 + 이탈 이 되어야 합니다.
