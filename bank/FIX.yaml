# 쿼리 디버깅: 잘못된 쿼리를 받아 원인을 찾고 고치기
- id: FIX-001
  title: 사라진 고객들 (LEFT JOIN + WHERE)
  level: 2
  tags: [LEFT JOIN, ON vs WHERE, 디버깅]
  question: |
    **요청:** "모든 고객의 2005년 5월 대여 건수(없으면 0)" — 그런데 아래 쿼리는 599명이 아니라 **520명**만 나옵니다.

    ```sql
    SELECT c.customer_id, COUNT(r.rental_id) AS may_rentals
    FROM customer c
    LEFT JOIN rental r ON r.customer_id = c.customer_id
    WHERE r.rental_date >= '2005-05-01' AND r.rental_date < '2005-06-01'
    GROUP BY c.customer_id
    ORDER BY c.customer_id;
    ```

    599명 모두 나오도록 고친 쿼리를 작성하세요. 출력 컬럼과 정렬은 그대로입니다.
  solution: |
    SELECT c.customer_id, COUNT(r.rental_id) AS may_rentals
    FROM customer c
    LEFT JOIN rental r ON r.customer_id = c.customer_id
                      AND r.rental_date >= '2005-05-01' AND r.rental_date < '2005-06-01'
    GROUP BY c.customer_id
    ORDER BY c.customer_id;
  note: |
    **원인:** 5월 대여가 없는 고객은 LEFT JOIN 결과에서 `r.rental_date` 가 NULL 인데, WHERE 의 비교가 NULL → 거짓 처리되어 행이 지워집니다. LEFT JOIN 이 INNER JOIN 이 된 것이죠.
    **수정:** 오른쪽 테이블에 대한 조건은 **ON 절**로 옮깁니다. "LEFT JOIN 했는데 건수가 줄었다" 면 가장 먼저 의심할 곳입니다.

- id: FIX-002
  title: 영화가 없는 언어가 1편? (COUNT(*) 함정)
  level: 2
  tags: [COUNT, LEFT JOIN, 디버깅]
  question: |
    **증상:** 영화가 한 편도 없는 언어(Italian, Japanese …)가 **1편**으로 나옵니다.

    ```sql
    SELECT l.name AS language, COUNT(*) AS films
    FROM language l
    LEFT JOIN film f ON f.language_id = l.language_id
    GROUP BY l.language_id, l.name
    ORDER BY films DESC, language;
    ```

    영화가 없는 언어는 0 이 나오도록 고치세요.
  solution: |
    SELECT l.name AS language, COUNT(f.film_id) AS films
    FROM language l
    LEFT JOIN film f ON f.language_id = l.language_id
    GROUP BY l.language_id, l.name
    ORDER BY films DESC, language;
  note: |
    **원인:** LEFT JOIN 은 매칭이 없을 때 오른쪽을 NULL 로 채운 **행 1개**를 만듭니다. `COUNT(*)` 는 그 행도 셉니다.
    **수정:** 오른쪽 테이블의 NOT NULL 컬럼(보통 PK)을 `COUNT(f.film_id)` 로 세면 NULL 이 빠져 0 이 됩니다.

- id: FIX-003
  title: 매출이 두 배로? (조인 팬아웃)
  level: 3
  tags: [팬아웃, SUM, 집계 후 조인, 디버깅]
  question: |
    **요청:** 고객 1~5번의 총 결제액과 총 대여 횟수. 그런데 결제액이 재무팀 숫자보다 **훨씬 큽니다.**

    ```sql
    SELECT c.customer_id, SUM(p.amount) AS total_paid, COUNT(r.rental_id) AS rentals
    FROM customer c
    JOIN payment p ON p.customer_id = c.customer_id
    JOIN rental r  ON r.customer_id = c.customer_id
    WHERE c.customer_id <= 5
    GROUP BY c.customer_id
    ORDER BY c.customer_id;
    ```

    정확한 `total_paid`, `rentals` 가 나오도록 고치세요.
  solution: |
    SELECT c.customer_id, p.total_paid, r.rentals
    FROM customer c
    JOIN (SELECT customer_id, SUM(amount) AS total_paid FROM payment GROUP BY customer_id) p
      ON p.customer_id = c.customer_id
    JOIN (SELECT customer_id, COUNT(*) AS rentals FROM rental GROUP BY customer_id) r
      ON r.customer_id = c.customer_id
    WHERE c.customer_id <= 5
    ORDER BY c.customer_id;
  note: |
    **원인:** 고객 1명에 결제 32건, 대여 32건이면 조인 결과는 32 × 32 = 1,024행이 되어 결제액이 **32배**로 부풀려집니다 (1:N 두 개를 한 번에 조인한 **팬아웃**).
    **수정:** 각 테이블을 **고객 단위로 먼저 집계**한 뒤 조인합니다. `COUNT(DISTINCT ...)` 로 건수는 고칠 수 있어도 SUM 은 고칠 수 없습니다.

- id: FIX-004
  title: 결과가 0행 (NOT IN 과 NULL)
  level: 3
  tags: [NOT IN, NULL, NOT EXISTS, 디버깅]
  question: |
    **요청:** 영화의 원어(`original_language_id`)로 쓰인 적 없는 언어 목록. 그런데 결과가 **0행**입니다.

    ```sql
    SELECT name
    FROM language
    WHERE language_id NOT IN (SELECT original_language_id FROM film)
    ORDER BY name;
    ```

    올바른 결과가 나오도록 고치세요.
  solution: |
    SELECT name
    FROM language l
    WHERE NOT EXISTS (SELECT 1 FROM film f WHERE f.original_language_id = l.language_id)
    ORDER BY name;
  note: |
    **원인:** `original_language_id` 는 모두 NULL 입니다. `x NOT IN (NULL, ...)` 은 항상 NULL(거짓 취급)이라 아무 행도 남지 않습니다.
    **수정:** `NOT EXISTS` 로 바꾸거나, 서브쿼리에 `WHERE original_language_id IS NOT NULL` 을 추가합니다. (SUB-006 참고)

- id: FIX-005
  title: 마지막 날이 빠진 기간 집계 (BETWEEN)
  level: 2
  tags: [BETWEEN, DATETIME, 반열린 구간, 디버깅]
  question: |
    **요청:** 2005-07-31 하루를 포함한 **2005-07-25 ~ 2005-07-31** 대여 건수. 그런데 아래 쿼리는 실제(3,256건)보다 **679건 적게** 나옵니다.

    ```sql
    SELECT COUNT(*) AS rentals
    FROM rental
    WHERE rental_date BETWEEN '2005-07-25' AND '2005-07-31';
    ```

    고친 쿼리를 작성하세요.
  solution: |
    SELECT COUNT(*) AS rentals
    FROM rental
    WHERE rental_date >= '2005-07-25' AND rental_date < '2005-08-01';
  note: |
    **원인:** `'2005-07-31'` 은 DATETIME 과 비교할 때 `2005-07-31 00:00:00` 이 되어, 31일 0시 이후 대여(679건)가 모두 빠집니다.
    **수정:** 반열린 구간 `>= 시작일 AND < 종료일 다음 날`. `BETWEEN '...' AND '2005-07-31 23:59:59'` 는 밀리초가 있는 컬럼에서 여전히 빈틈이 생깁니다.

- id: FIX-006
  title: 조건이 이상하게 적용됨 (AND/OR 우선순위)
  level: 2
  tags: [AND, OR, 괄호, 디버깅]
  question: |
    **요청:** "등급이 R 또는 NC-17 이고, 대여료가 4.99 인 영화 수". 그런데 숫자가 예상보다 훨씬 큽니다.

    ```sql
    SELECT COUNT(*) AS films
    FROM film
    WHERE rating = 'R' OR rating = 'NC-17' AND rental_rate = 4.99;
    ```

    고친 쿼리를 작성하세요.
  solution: |
    SELECT COUNT(*) AS films
    FROM film
    WHERE rating IN ('R', 'NC-17') AND rental_rate = 4.99;
  note: |
    **원인:** AND 가 OR 보다 먼저 계산되어 `rating = 'R' OR (rating = 'NC-17' AND rental_rate = 4.99)` 가 됩니다 → R 등급은 대여료와 무관하게 전부 포함.
    **수정:** 괄호로 묶거나 `IN` 을 씁니다. OR 가 섞인 WHERE 는 항상 괄호를 명시하는 습관을 들이세요.

- id: FIX-007
  title: 이전 고객의 값이 섞임 (PARTITION BY 누락)
  level: 3
  tags: [LAG, PARTITION BY, 디버깅]
  question: |
    **요청:** 고객 1~3번의 **각 고객의 첫 대여**는 직전 대여 간격이 NULL 이어야 합니다. 그런데 고객 2번의 첫 대여에 고객 1번의 마지막 대여 날짜가 들어갑니다.

    ```sql
    SELECT customer_id, rental_id, rental_date,
           DATEDIFF(rental_date, LAG(rental_date) OVER (ORDER BY customer_id, rental_date, rental_id)) AS gap_days
    FROM rental
    WHERE customer_id <= 3
    ORDER BY customer_id, rental_date, rental_id;
    ```

    고친 쿼리를 작성하세요.
  solution: |
    SELECT customer_id, rental_id, rental_date,
           DATEDIFF(rental_date, LAG(rental_date) OVER (PARTITION BY customer_id ORDER BY rental_date, rental_id)) AS gap_days
    FROM rental
    WHERE customer_id <= 3
    ORDER BY customer_id, rental_date, rental_id;
  note: |
    **원인:** PARTITION BY 가 없으면 윈도우는 **전체 결과 하나**라서, 정렬상 바로 앞 행(다른 고객)의 값을 가져옵니다. 음수 간격이 나오는 것도 이 때문입니다.
    **수정:** "고객별" 계산이면 `PARTITION BY customer_id`. `ORDER BY customer_id` 를 넣는 것으로는 경계가 나뉘지 않습니다.

- id: FIX-008
  title: 마지막 값이 자기 자신 (LAST_VALUE 프레임)
  level: 3
  tags: [LAST_VALUE, 윈도우 프레임, 디버깅]
  question: |
    **요청:** 고객 1~3번의 **마지막 대여일**을 모든 행에 붙이기. 그런데 `last_rental` 이 매 행의 `rental_date` 와 똑같습니다.

    ```sql
    SELECT customer_id, rental_id, rental_date,
           LAST_VALUE(rental_date) OVER (PARTITION BY customer_id ORDER BY rental_date, rental_id) AS last_rental
    FROM rental
    WHERE customer_id <= 3
    ORDER BY customer_id, rental_date, rental_id;
    ```

    고친 쿼리를 작성하세요.
  solution: |
    SELECT customer_id, rental_id, rental_date,
           LAST_VALUE(rental_date) OVER (PARTITION BY customer_id ORDER BY rental_date, rental_id
                                         ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS last_rental
    FROM rental
    WHERE customer_id <= 3
    ORDER BY customer_id, rental_date, rental_id;
  note: |
    **원인:** ORDER BY 가 있는 윈도우의 기본 프레임은 "처음 ~ **현재 행**" 이라, 프레임의 마지막 값 = 현재 행입니다.
    **수정:** 프레임을 파티션 전체로 넓히거나, 더 간단히 `MAX(rental_date) OVER (PARTITION BY customer_id)` 를 씁니다.

- id: FIX-009
  title: 윈도우 함수를 WHERE 에 써서 오류
  level: 2
  tags: [윈도우 함수, WHERE, 파생 테이블, 디버깅]
  question: |
    **증상:** 아래 쿼리는 `You cannot use the window function 'row_number' in this context` 오류가 납니다.

    ```sql
    SELECT c.name AS category, f.title, f.length
    FROM film f
    JOIN film_category fc ON fc.film_id = f.film_id
    JOIN category c ON c.category_id = fc.category_id
    WHERE ROW_NUMBER() OVER (PARTITION BY c.category_id ORDER BY f.length DESC, f.title) = 1
    ORDER BY category;
    ```

    의도(장르별 가장 긴 영화 1편, 동점이면 제목순)대로 동작하게 고치세요.
  solution: |
    SELECT category, title, length
    FROM (
        SELECT c.name AS category, f.title, f.length,
               ROW_NUMBER() OVER (PARTITION BY c.category_id ORDER BY f.length DESC, f.title) AS rn
        FROM film f
        JOIN film_category fc ON fc.film_id    = f.film_id
        JOIN category c       ON c.category_id = fc.category_id
    ) t
    WHERE rn = 1
    ORDER BY category;
  note: |
    **원인:** 윈도우 함수는 WHERE·GROUP BY·HAVING **이후**(SELECT 단계)에 계산되므로 WHERE 에서 참조할 수 없습니다.
    **수정:** 파생 테이블이나 CTE 에서 먼저 계산하고 바깥에서 거릅니다. (MySQL 은 Snowflake 의 `QUALIFY` 를 지원하지 않습니다.)

- id: FIX-010
  title: 마지막 대여의 영화 제목 (ONLY_FULL_GROUP_BY)
  level: 3
  tags: [GROUP BY, ONLY_FULL_GROUP_BY, 그룹별 최신 행, 디버깅]
  question: |
    **요청:** 고객 1~5번의 마지막 대여 일시와 **그때 빌린 영화 제목**. 아래 쿼리는 오류가 납니다:
    `Expression #3 of SELECT list is not in GROUP BY clause ... incompatible with sql_mode=only_full_group_by`

    ```sql
    SELECT r.customer_id, MAX(r.rental_date) AS last_rental, f.title
    FROM rental r
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id      = i.film_id
    WHERE r.customer_id <= 5
    GROUP BY r.customer_id
    ORDER BY r.customer_id;
    ```

    의도대로(마지막 대여 1건의 제목, 같은 시각이면 `rental_id` 가 큰 것) 동작하게 고치세요.
  solution: |
    SELECT customer_id, last_rental, title
    FROM (
        SELECT r.customer_id, r.rental_date AS last_rental, f.title,
               ROW_NUMBER() OVER (PARTITION BY r.customer_id ORDER BY r.rental_date DESC, r.rental_id DESC) AS rn
        FROM rental r
        JOIN inventory i ON i.inventory_id = r.inventory_id
        JOIN film f      ON f.film_id      = i.film_id
        WHERE r.customer_id <= 5
    ) t
    WHERE rn = 1
    ORDER BY customer_id;
  note: |
    **원인:** `MAX(rental_date)` 는 그룹에서 최댓값 **하나**를 계산할 뿐, "그 최댓값을 가진 행의 다른 컬럼" 을 가져오지 않습니다. 고객의 대여가 30건이면 `f.title` 후보도 30개라 MySQL 이 거부합니다.
    **수정:** 그룹별 최신 행이 필요하면 `ROW_NUMBER()` 로 1등 행을 고르거나, `(customer_id, MAX(rental_date))` 를 구해 다시 조인합니다 (SUB-020).
    ⚠️ `ANY_VALUE(f.title)` 로 오류만 끄면 **아무 대여의 제목**이 나와 조용히 틀린 답이 됩니다. 예전 MySQL(5.6 이하)은 기본 설정이 이랬기 때문에 레거시 쿼리에서 자주 발견되는 버그입니다.

- id: FIX-011
  title: 잘못된 조인 키
  level: 3
  tags: [조인 키, 카테시안, 디버깅]
  question: |
    **요청:** 결제 건별로 어떤 영화의 대여인지 붙이기 (`payment_id` 1~10). 그런데 결과가 수백 행이나 나옵니다.

    ```sql
    SELECT p.payment_id, p.amount, f.title
    FROM payment p
    JOIN rental r    ON r.customer_id = p.customer_id
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id = i.film_id
    WHERE p.payment_id <= 10
    ORDER BY p.payment_id;
    ```

    결제 1건당 정확히 1행이 나오도록 고치세요.
  solution: |
    SELECT p.payment_id, p.amount, f.title
    FROM payment p
    JOIN rental r    ON r.rental_id    = p.rental_id
    JOIN inventory i ON i.inventory_id = r.inventory_id
    JOIN film f      ON f.film_id      = i.film_id
    WHERE p.payment_id <= 10
    ORDER BY p.payment_id;
  note: |
    **원인:** 결제와 대여를 **고객 번호**로 이으면 "그 고객의 모든 대여" 와 짝지어집니다 (결제 1건 × 대여 32건).
    **수정:** 두 테이블을 잇는 진짜 관계는 FK `payment.rental_id → rental.rental_id` 입니다. 조인 전에 스키마 탐색에서 **FK 관계**를 확인하세요.
    "결과 행 수가 기대보다 많다" 는 대부분 조인 키 문제입니다.

- id: FIX-012
  title: 주소가 통째로 NULL (CONCAT 과 NULL)
  level: 2
  tags: [CONCAT, CONCAT_WS, NULL, 디버깅]
  question: |
    **요청:** 주소 1~6번의 전체 주소 문자열(`address`, `address2`, `district` 를 `, ` 로 연결). 그런데 일부 행이 **NULL** 로 나옵니다.

    ```sql
    SELECT address_id, CONCAT(address, ', ', address2, ', ', district) AS full_address
    FROM address
    WHERE address_id <= 6
    ORDER BY address_id;
    ```

    값이 없는 부분은 건너뛰도록 고치세요. (빈 문자열도 건너뜁니다)
  solution: |
    SELECT address_id,
           CONCAT_WS(', ', NULLIF(address, ''), NULLIF(address2, ''), NULLIF(district, '')) AS full_address
    FROM address
    WHERE address_id <= 6
    ORDER BY address_id;
  note: |
    **원인:** `CONCAT` 은 인자 하나라도 NULL 이면 결과 전체가 NULL 입니다. 주소 1~4번은 `address2` 가 NULL 입니다.
    **수정:** `CONCAT_WS(구분자, ...)` 는 NULL 인자를 건너뜁니다. 빈 문자열은 건너뛰지 않으므로 `NULLIF(x, '')` 로 NULL 로 바꿔 함께 처리했습니다 (주소 5·6번은 `address2` 가 빈 문자열).

- id: FIX-013
  title: 비율이 전부 0 (DIV 정수 나눗셈)
  level: 2
  tags: [DIV, 나눗셈, 형 변환, 디버깅]
  question: |
    **증상:** 등급별 "대여료 4.99 영화 비율(%)" 이 전부 0 으로 나옵니다.

    ```sql
    SELECT rating, SUM(rental_rate = 4.99) DIV COUNT(*) * 100 AS premium_pct
    FROM film
    GROUP BY rating
    ORDER BY rating;
    ```

    소수 1자리 백분율이 나오도록 고치세요.
  solution: |
    SELECT rating, ROUND(100 * SUM(rental_rate = 4.99) / COUNT(*), 1) AS premium_pct
    FROM film
    GROUP BY rating
    ORDER BY rating;
  note: |
    **원인:** `DIV` 는 **정수 나눗셈**이라 (예) 60 DIV 200 = 0, 거기에 100 을 곱해도 0 입니다. 다른 DBMS(SQL Server, PostgreSQL)에서는 정수 `/` 정수도 정수 나눗셈입니다.
    **수정:** MySQL 은 `/` 가 소수 결과를 주므로 `/` 를 쓰고, 다른 DBMS 로 옮길 코드라면 `100.0 * a / b` 처럼 **먼저 소수로 만들고** 나누세요.

- id: FIX-014
  title: 문자열로 정렬된 숫자
  level: 2
  tags: [정렬, 형 변환, CAST, 디버깅]
  question: |
    **증상:** 우편번호가 **작은** 순서대로 5개를 뽑았는데 `1027`, `10417` … 이 나옵니다. 그런데 데이터에는 `3`, `400` 같은 더 작은 번호도 있습니다.

    ```sql
    SELECT address_id, postal_code
    FROM address
    WHERE postal_code <> ''
    ORDER BY postal_code
    LIMIT 5;
    ```

    **숫자 크기 기준**으로 작은 5개가 나오도록 고치세요. 같으면 `address_id` 순.
  solution: |
    SELECT address_id, postal_code
    FROM address
    WHERE postal_code <> ''
    ORDER BY CAST(postal_code AS UNSIGNED), address_id
    LIMIT 5;
  note: |
    **원인:** `postal_code` 는 VARCHAR 라 **사전 순**으로 정렬됩니다. 문자열에서는 첫 글자부터 비교하므로 `'1027' < '3'` 입니다 ('1' < '3').
    우편번호 길이는 5자리 534개, 4자리 59개, 3자리 5개, 1자리 1개로 섞여 있어 이런 차이가 생깁니다.
    **수정:** 숫자로 비교하려면 `CAST(... AS UNSIGNED)`. 다만 우편번호처럼 앞자리 0 이 의미 있는 코드는 원래 문자열이 맞는 타입입니다 — 정렬 목적에 따라 판단하세요.

- id: FIX-015
  title: 동점자가 잘린 TOP 3
  level: 3
  tags: [LIMIT, RANK, 동점, 디버깅]
  question: |
    **요청:** "결제 합계 TOP 3 고객에게 상품 지급, **동점자는 모두 포함**". 그런데 아래 쿼리는 4위와 동점인 3위 고객 중 한 명을 빠뜨립니다... 혹은 빠뜨릴 수 있습니다.

    ```sql
    SELECT customer_id, SUM(amount) AS total
    FROM payment
    GROUP BY customer_id
    ORDER BY total DESC
    LIMIT 3;
    ```

    동점을 포함해 **결제 합계 4위까지**(공동 4위 포함) 모든 고객이 나오도록 고치세요. (현재 데이터에서 4위가 동점입니다)

    - 출력: `rnk`, `customer_id`, `total` — `rnk`, `customer_id` 순
  solution: |
    SELECT rnk, customer_id, total
    FROM (
        SELECT customer_id, SUM(amount) AS total,
               RANK() OVER (ORDER BY SUM(amount) DESC) AS rnk
        FROM payment
        GROUP BY customer_id
    ) t
    WHERE rnk <= 4
    ORDER BY rnk, customer_id;
  note: |
    **원인:** `LIMIT n` 은 정렬 후 **정확히 n행**만 남기므로 경계의 동점자를 임의로 자릅니다. 2차 정렬이 없으면 누가 잘릴지도 실행마다 달라질 수 있습니다.
    **수정:** "N위까지" 는 `RANK() <= N`. 4위가 공동(MARION SNYDER, RHONDA KENNEDY)이라 5명이 나옵니다.

- id: FIX-016
  title: 평균의 평균
  level: 3
  tags: [평균, 가중 평균, 집계 단위, 디버깅]
  question: |
    **요청:** "전체 결제의 건당 평균 금액" (= 모든 결제 금액의 평균). 그런데 아래 쿼리는 미세하게 다른 값을 냅니다.

    ```sql
    SELECT ROUND(AVG(avg_amount), 4) AS avg_payment
    FROM (
        SELECT customer_id, AVG(amount) AS avg_amount
        FROM payment
        GROUP BY customer_id
    ) t;
    ```

    요청대로의 값과, 원래 쿼리의 값을 나란히 구하세요.

    - 출력: `correct_avg`, `avg_of_avgs` (둘 다 소수 4자리)
  solution: |
    SELECT ROUND((SELECT AVG(amount) FROM payment), 4) AS correct_avg,
           ROUND((SELECT AVG(avg_amount)
                  FROM (SELECT customer_id, AVG(amount) AS avg_amount FROM payment GROUP BY customer_id) t), 4) AS avg_of_avgs;
  note: |
    **원인:** "고객별 평균의 평균" 은 결제가 1건인 고객과 40건인 고객에게 **같은 가중치**를 줍니다. 건당 평균과는 다른 지표입니다.
    **수정:** 원하는 단위(결제 건)에서 바로 평균을 내거나, `SUM(합계) / SUM(건수)` 로 가중 평균을 냅니다.
    둘 중 어느 것이 맞는지는 질문에 달려 있습니다 — "평균적인 고객의 평균 결제액" 이라면 오히려 평균의 평균이 정답입니다.
