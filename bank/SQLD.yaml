# SQLD 유형: 시험 빈출 개념을 MySQL 로 실습 (Oracle 문법과의 차이는 해설에)
- id: SQLD-001
  title: NULL 의 연산 규칙
  level: 1
  tags: [NULL, NVL, 산술 연산]
  question: |
    테이블 없이 아래 식의 결과를 한 행으로 출력하세요.

    | 컬럼 | 식 |
    |---|---|
    | `plus` | `NULL + 1` |
    | `eq` | `NULL = NULL` |
    | `is_null` | `NULL IS NULL` |
    | `nvl` | NULL 이면 0 (`IFNULL`) |
    | `concat_null` | `CONCAT('A', NULL)` |
    | `coalesce3` | `COALESCE(NULL, NULL, 'C')` |
  solution: |
    SELECT NULL + 1                 AS plus,
           NULL = NULL              AS eq,
           NULL IS NULL             AS is_null,
           IFNULL(NULL, 0)          AS nvl,
           CONCAT('A', NULL)        AS concat_null,
           COALESCE(NULL, NULL, 'C') AS coalesce3;
  note: |
    **SQLD 빈출**: NULL 과의 산술 연산·비교 연산은 모두 **NULL** 입니다. `NULL = NULL` 도 TRUE 가 아닙니다.
    - Oracle `NVL(a, b)` = MySQL `IFNULL(a, b)`, Oracle `NVL2(a, b, c)` = MySQL `IF(a IS NOT NULL, b, c)`
    - ⚠️ Oracle 은 `'A' || NULL` 이 `'A'` (NULL 을 빈 문자열로 취급)이지만, MySQL `CONCAT('A', NULL)` 은 **NULL** 입니다.
    - Oracle 은 빈 문자열 `''` 을 NULL 로 취급하지만 MySQL 은 다릅니다.

- id: SQLD-002
  title: 집계 함수는 NULL 을 무시한다
  level: 2
  tags: [AVG, COUNT, NULL]
  question: |
    대여 기간(일, `DATEDIFF(return_date, rental_date)`)에 대해 다음을 한 행으로 구하세요. 미반납은 return_date 가 NULL 입니다.

    - `cnt_all`: `COUNT(*)`
    - `cnt_days`: 대여 기간의 `COUNT`
    - `avg_ignore_null`: 대여 기간의 평균 (소수 4자리)
    - `avg_null_as_zero`: 미반납을 0일로 보고 낸 평균 (소수 4자리)
    - `sum_div_all`: 대여 기간 합계 / `COUNT(*)` (소수 4자리)

    **사용 테이블:** `rental`
  solution: |
    SELECT COUNT(*) AS cnt_all,
           COUNT(DATEDIFF(return_date, rental_date)) AS cnt_days,
           ROUND(AVG(DATEDIFF(return_date, rental_date)), 4) AS avg_ignore_null,
           ROUND(AVG(IFNULL(DATEDIFF(return_date, rental_date), 0)), 4) AS avg_null_as_zero,
           ROUND(SUM(DATEDIFF(return_date, rental_date)) / COUNT(*), 4) AS sum_div_all
    FROM rental;
  note: |
    **SQLD 빈출**: `AVG(col)` = `SUM(col) / COUNT(col)` 이지 `SUM(col) / COUNT(*)` 가 아닙니다. NULL 행은 분모에서도 빠집니다.
    그래서 `avg_null_as_zero` 와 `sum_div_all` 이 같고, `avg_ignore_null` 만 다릅니다.
    `COUNT(*)` 는 NULL 을 포함한 행 수, `COUNT(col)` 은 NULL 이 아닌 값의 수입니다.

- id: SQLD-003
  title: ORDER BY 위치 번호와 별칭
  level: 1
  tags: [ORDER BY, 위치 번호, 별칭]
  question: |
    등급별 영화 수와 평균 대여료(소수 2자리)를 구하고, **SELECT 목록의 위치 번호**를 이용해
    영화 수(2번째 컬럼) 내림차순, 등급(1번째 컬럼) 오름차순으로 정렬하세요.

    - 출력: `rating`, `films`, `avg_rate`

    **사용 테이블:** `film`
  solution: |
    SELECT rating, COUNT(*) AS films, ROUND(AVG(rental_rate), 2) AS avg_rate
    FROM film
    GROUP BY rating
    ORDER BY 2 DESC, 1;
  note: |
    **SQLD 빈출**: ORDER BY 에는 컬럼명, **별칭**, **SELECT 목록 위치 번호**를 모두 쓸 수 있습니다 (섞어 써도 됨).
    실행 순서상 ORDER BY 가 SELECT 다음이라 별칭이 가능하지만, WHERE·GROUP BY 에서는 (표준상) 별칭을 쓸 수 없습니다.
    위치 번호는 SELECT 목록이 바뀌면 의미가 바뀌므로 실무 코드에서는 권장되지 않습니다.

- id: SQLD-004
  title: DECODE 를 CASE 로
  level: 1
  tags: [DECODE, CASE]
  question: |
    Oracle 의 아래 쿼리와 같은 결과를 MySQL 로 작성하세요.

    ```sql
    SELECT store_id,
           SUM(DECODE(active, 1, 1, 0)) AS active_cnt,
           SUM(DECODE(active, 0, 1, 0)) AS dormant_cnt
    FROM customer
    GROUP BY store_id
    ORDER BY store_id;
    ```

    **사용 테이블:** `customer`
  solution: |
    SELECT store_id,
           SUM(CASE active WHEN 1 THEN 1 ELSE 0 END) AS active_cnt,
           SUM(CASE active WHEN 0 THEN 1 ELSE 0 END) AS dormant_cnt
    FROM customer
    GROUP BY store_id
    ORDER BY store_id;
  note: |
    `DECODE(expr, 값1, 결과1, 값2, 결과2, ..., 기본값)` 은 Oracle 전용이며 **단순 CASE** 와 같습니다.
    단, DECODE 는 `NULL` 끼리 같다고 보지만 `CASE expr WHEN NULL` 은 절대 참이 되지 않는다는 차이가 있습니다(시험 단골).

- id: SQLD-005
  title: NVL2 를 IF 로
  level: 1
  tags: [NVL2, IF]
  question: |
    Oracle 의 `NVL2(return_date, '반납', '미반납')` 과 같은 의미로, 직원(`rental.staff_id`)별 반납/미반납 건수를 구하세요.

    - 출력: `staff_id`, `status`, `rentals` — `staff_id`, `status` 순

    **사용 테이블:** `rental`
  solution: |
    SELECT staff_id,
           IF(return_date IS NOT NULL, '반납', '미반납') AS status,
           COUNT(*) AS rentals
    FROM rental
    GROUP BY staff_id, status
    ORDER BY staff_id, status;
  note: |
    `NVL2(a, b, c)`: a 가 NULL 이 **아니면** b, NULL 이면 c. 인자 순서를 헷갈리기 쉬운 시험 단골입니다.
    MySQL 에는 NVL2 가 없으므로 `IF(a IS NOT NULL, b, c)` 또는 `CASE WHEN a IS NOT NULL THEN b ELSE c END` 를 씁니다.

- id: SQLD-006
  title: GROUP BY 없는 HAVING
  level: 2
  tags: [HAVING, 전체 그룹]
  question: |
    전체 결제의 평균 금액이 **4 이상일 때만** 평균 금액(소수 2자리)과 결제 건수를 출력하세요. GROUP BY 를 쓰지 마세요.

    - 출력: `avg_amount`, `payments`

    **사용 테이블:** `payment`
  solution: |
    SELECT ROUND(AVG(amount), 2) AS avg_amount, COUNT(*) AS payments
    FROM payment
    HAVING AVG(amount) >= 4;
  note: |
    **SQLD 빈출**: GROUP BY 없이 HAVING 을 쓰면 **테이블 전체가 하나의 그룹**이 됩니다. 조건이 거짓이면 0행, 참이면 1행이 나옵니다.
    (WHERE 로 집계 조건을 걸 수 없다는 것과 함께 자주 출제됩니다.) 조건을 `>= 5` 로 바꿔 0행이 되는지 확인해 보세요.

- id: SQLD-007
  title: NULL 의 정렬 위치 (Oracle vs MySQL)
  level: 2
  tags: [ORDER BY, NULL 정렬, NULLS LAST]
  question: |
    고객 1~3번의 대여 중 2005-08-20 이후 대여의 `rental_id`, `customer_id`, `return_date` 를
    **반납일 오름차순**으로 정렬하되, Oracle 의 기본 동작처럼 **NULL 이 맨 뒤**에 오게 하세요. 같으면 `rental_id` 순.

    **사용 테이블:** `rental`
  solution: |
    SELECT rental_id, customer_id, return_date
    FROM rental
    WHERE customer_id <= 3 AND rental_date >= '2005-08-20'
    ORDER BY return_date IS NULL, return_date, rental_id;
  note: |
    **SQLD 빈출**: Oracle 은 NULL 을 **가장 큰 값**으로 취급해 ASC 에서 맨 뒤, DESC 에서 맨 앞에 둡니다.
    MySQL·SQL Server 는 반대로 **가장 작은 값**으로 취급합니다. Oracle 은 `NULLS FIRST / NULLS LAST` 로 바꿀 수 있지만 MySQL 은 `IS NULL` 정렬 키를 씁니다.

- id: SQLD-008
  title: ROWNUM 과 Top-N 의 함정
  level: 2
  tags: [ROWNUM, Top-N, ROW_NUMBER]
  question: |
    상영 시간 기준으로 **3~5번째로 긴** 영화의 순번, 제목, 상영 시간을 구하세요. (`length` 내림차순, 같으면 `title` 순으로 순번)

    - 출력: `rn`, `title`, `length` — `rn` 순

    **사용 테이블:** `film`
  solution: |
    SELECT rn, title, length
    FROM (
        SELECT ROW_NUMBER() OVER (ORDER BY length DESC, title) AS rn, title, length
        FROM film
    ) t
    WHERE rn BETWEEN 3 AND 5
    ORDER BY rn;
  note: |
    **SQLD 빈출**: Oracle 의 `WHERE ROWNUM <= 5 ORDER BY length DESC` 는 **정렬 전에** 5건을 자른 뒤 정렬하므로 틀린 답입니다.
    또 `WHERE ROWNUM BETWEEN 3 AND 5` 는 항상 0건입니다 (ROWNUM 은 1부터 순서대로 부여되므로 첫 행이 3이 될 수 없음).
    정답은 "정렬한 인라인 뷰 → 바깥에서 번호로 거르기" 이며, MySQL 은 `LIMIT 2, 3` 또는 `ROW_NUMBER()` 를 씁니다.

- id: SQLD-009
  title: NATURAL JOIN 의 함정
  level: 3
  tags: [NATURAL JOIN, USING]
  question: |
    `film_category` 와 `category` 를 조인한 결과 행 수를 두 가지 방법으로 구해 비교하세요.

    - `using_cnt`: `USING (category_id)` 로 조인한 행 수
    - `natural_cnt`: `NATURAL JOIN` 으로 조인한 행 수

    **사용 테이블:** `film_category`, `category`
  solution: |
    SELECT (SELECT COUNT(*) FROM film_category JOIN category USING (category_id)) AS using_cnt,
           (SELECT COUNT(*) FROM film_category NATURAL JOIN category)            AS natural_cnt;
  note: |
    결과: `1000` vs `0`. NATURAL JOIN 은 **이름이 같은 모든 컬럼**으로 조인하는데, 두 테이블 모두 `last_update` 를 가지고 있어
    `category_id` 뿐 아니라 `last_update` 까지 같아야 하는 조건이 붙기 때문입니다.
    **SQLD 빈출**: NATURAL JOIN·USING 에 쓰인 컬럼에는 **테이블 별칭(접두사)을 붙일 수 없다**는 것도 자주 나옵니다.

- id: SQLD-010
  title: OUTER JOIN 결과 건수
  level: 3
  tags: [LEFT OUTER JOIN, ON vs WHERE, 건수]
  question: |
    고객과 **2006년 대여**를 LEFT OUTER JOIN 했을 때의 결과 행 수를 두 가지로 구하세요.

    - `on_cnt`: 2006년 조건을 **ON 절**에 둔 경우
    - `where_cnt`: 2006년 조건을 **WHERE 절**에 둔 경우

    **사용 테이블:** `customer`, `rental`
  solution: |
    SELECT
      (SELECT COUNT(*) FROM customer c
         LEFT JOIN rental r ON r.customer_id = c.customer_id AND r.rental_date >= '2006-01-01') AS on_cnt,
      (SELECT COUNT(*) FROM customer c
         LEFT JOIN rental r ON r.customer_id = c.customer_id
        WHERE r.rental_date >= '2006-01-01') AS where_cnt;
  note: |
    - ON 에 두면: 모든 고객이 보존되고 2006년 대여가 붙습니다 → (2006년 대여 건수) + (2006년 대여가 없는 고객 수)
    - WHERE 에 두면: 조인 후 거르므로 NULL 행이 사라져 **INNER JOIN 과 같아집니다** → 2006년 대여 건수
    Oracle 의 `(+)` 표기에서도 같은 원리로, 조건에 `(+)` 를 빠뜨리면 아우터 조인이 이너 조인으로 바뀝니다.

- id: SQLD-011
  title: FULL OUTER JOIN 흉내내기
  level: 3
  tags: [FULL OUTER JOIN, UNION]
  question: |
    MySQL 에는 FULL OUTER JOIN 이 없습니다. 아래 두 집합을 **FULL OUTER JOIN** 한 결과를 만드세요.

    - A: 1번 매장(`customer.store_id = 1`) 고객이 사는 국가별 고객 수
    - B: 2번 매장 고객이 사는 국가별 고객 수

    출력: `country`, `store1`, `store2` (없는 쪽은 NULL) — `country` 순

    **사용 테이블:** `customer`, `address`, `city`, `country`
  solution: |
    WITH cc AS (
        SELECT co.country, c.store_id, COUNT(*) AS n
        FROM customer c
        JOIN address a  ON a.address_id  = c.address_id
        JOIN city ci    ON ci.city_id    = a.city_id
        JOIN country co ON co.country_id = ci.country_id
        GROUP BY co.country, c.store_id
    ), a AS (SELECT country, n FROM cc WHERE store_id = 1),
       b AS (SELECT country, n FROM cc WHERE store_id = 2)
    SELECT a.country, a.n AS store1, b.n AS store2
    FROM a LEFT JOIN b ON b.country = a.country
    UNION
    SELECT b.country, a.n, b.n
    FROM a RIGHT JOIN b ON b.country = a.country
    ORDER BY country;
  note: |
    FULL OUTER JOIN = LEFT OUTER JOIN ∪ RIGHT OUTER JOIN (중복 제거). 두 결과를 `UNION` 으로 합칩니다.
    `UNION ALL` 을 쓰면 양쪽에 다 있는 국가가 두 번 나오니 주의하세요. 결과에서 한쪽 매장에만 고객이 있는 국가를 확인해 보세요.

- id: SQLD-012
  title: 단일행 서브쿼리 vs 다중행 서브쿼리
  level: 2
  tags: [다중행 서브쿼리, IN, 단일행 연산자]
  question: |
    성이 `KILMER` 인 배우들이 출연한 영화의 수를 구하세요. (`KILMER` 성을 가진 배우는 여러 명입니다)

    - 출력: `films`

    **사용 테이블:** `film_actor`, `actor`
  solution: |
    SELECT COUNT(DISTINCT film_id) AS films
    FROM film_actor
    WHERE actor_id IN (SELECT actor_id FROM actor WHERE last_name = 'KILMER');
  note: |
    **SQLD 빈출**: 서브쿼리가 여러 행을 돌려줄 수 있으면 `=`, `>` 같은 **단일행 연산자**를 쓸 수 없습니다 (`Subquery returns more than 1 row` 오류).
    다중행 연산자 `IN`, `ANY`, `ALL`, `EXISTS` 를 써야 합니다. 두 배우가 같은 영화에 나왔을 수 있으므로 `DISTINCT` 도 필요합니다.

- id: SQLD-013
  title: 다중 컬럼 서브쿼리
  level: 3
  tags: [다중 컬럼 서브쿼리, 그룹별 최댓값]
  question: |
    등급별로 상영 시간이 **가장 긴** 영화를 `(rating, length) IN (SELECT ...)` 형식의 다중 컬럼 서브쿼리로 구하세요.

    - 출력: `rating`, `title`, `length` — `rating`, `title` 순

    **사용 테이블:** `film`
  solution: |
    SELECT rating, title, length
    FROM film
    WHERE (rating, length) IN (SELECT rating, MAX(length) FROM film GROUP BY rating)
    ORDER BY rating, title;
  note: |
    다중 컬럼 서브쿼리는 Oracle·MySQL 모두 지원하지만 **SQL Server 는 지원하지 않습니다** (시험 단골 비교 문항).
    `WHERE length IN (SELECT MAX(length) ... GROUP BY rating)` 처럼 한 컬럼만 비교하면, 다른 등급의 최댓값과 우연히 같은 영화까지 섞입니다.

- id: SQLD-014
  title: ORDER BY 절의 스칼라 서브쿼리
  level: 3
  tags: [스칼라 서브쿼리, ORDER BY]
  question: |
    고객 1~20번을 **가장 최근 대여일이 늦은 순**으로 정렬해 상위 5명의 `customer_id`, `first_name`, `last_name` 을 조회하세요.
    최근 대여일은 SELECT 목록에 넣지 말고 **ORDER BY 절의 스칼라 서브쿼리**로만 사용하세요. 같으면 `customer_id` 순.

    **사용 테이블:** `customer`, `rental`
  solution: |
    SELECT c.customer_id, c.first_name, c.last_name
    FROM customer c
    WHERE c.customer_id <= 20
    ORDER BY (SELECT MAX(r.rental_date) FROM rental r WHERE r.customer_id = c.customer_id) DESC,
             c.customer_id
    LIMIT 5;
  note: |
    스칼라 서브쿼리는 SELECT 절뿐 아니라 **ORDER BY, WHERE, HAVING, CASE** 등 값이 올 수 있는 거의 모든 곳에 쓸 수 있습니다.
    단, **GROUP BY 절에는 쓸 수 없다**(Oracle 기준)는 것이 시험에 나옵니다.

- id: SQLD-015
  title: MINUS 를 EXCEPT 로
  level: 2
  tags: [MINUS, EXCEPT, 집합 연산]
  question: |
    배우의 성(`last_name`) 중 **고객의 성으로는 쓰이지 않는** 성을 중복 없이 구하세요. (Oracle 의 `MINUS`)

    - 출력: `last_name` — `last_name` 순

    **사용 테이블:** `actor`, `customer`
  solution: |
    SELECT last_name FROM actor
    EXCEPT
    SELECT last_name FROM customer
    ORDER BY last_name;
  note: |
    Oracle 은 `MINUS`, 표준·SQL Server·MySQL(8.0.31+) 은 `EXCEPT` 입니다. 결과는 **중복이 제거**됩니다.
    **SQLD 빈출**: 집합 연산의 결과 컬럼 이름은 **첫 번째 SELECT** 를 따르고, ORDER BY 는 **마지막에 한 번만** 씁니다.

- id: SQLD-016
  title: CUBE 흉내내기
  level: 4
  tags: [CUBE, ROLLUP, UNION ALL, GROUPING]
  question: |
    MySQL 에는 `CUBE` 가 없습니다. 매장(`staff.store_id`) × 등급(`film.rating`) 매출을 **CUBE** 처럼 집계하세요.
    즉 (매장, 등급), (매장 소계), (등급 소계), (총계) 네 종류의 행이 모두 있어야 합니다.

    - 출력: `store`, `rating`, `revenue` — 소계·총계는 해당 칸을 `'ALL'` 로 표시
    - 정렬: `store`, `rating` 순 (`'ALL'` 은 각각 마지막). 등급은 G → PG → PG-13 → R → NC-17 순서

    **사용 테이블:** `payment`, `staff`, `rental`, `inventory`, `film`
  solution: |
    WITH base AS (
        SELECT CAST(s.store_id AS CHAR) AS store, CAST(f.rating AS CHAR) AS rating, p.amount
        FROM payment p
        JOIN staff s     ON s.staff_id     = p.staff_id
        JOIN rental r    ON r.rental_id    = p.rental_id
        JOIN inventory i ON i.inventory_id = r.inventory_id
        JOIN film f      ON f.film_id      = i.film_id
    ), cubed AS (
        SELECT IF(GROUPING(store) = 1, 'ALL', store) AS store,
               IF(GROUPING(rating) = 1, 'ALL', rating) AS rating,
               SUM(amount) AS revenue
        FROM base GROUP BY store, rating WITH ROLLUP
        UNION ALL
        SELECT 'ALL', rating, SUM(amount) FROM base GROUP BY rating
    )
    SELECT store, rating, revenue
    FROM cubed
    ORDER BY store = 'ALL', store, FIELD(rating, 'G', 'PG', 'PG-13', 'R', 'NC-17', 'ALL');
  note: |
    `ROLLUP(a, b)` 는 (a,b), (a), () 만 만듭니다. `CUBE(a, b)` 는 여기에 **(b) 소계**까지 모든 조합을 만듭니다.
    그래서 ROLLUP 결과에 "등급별 소계"를 `UNION ALL` 로 추가하면 CUBE 와 같아집니다. 그룹 수: ROLLUP 은 n+1 종류, CUBE 는 2ⁿ 종류.
    참고: MySQL 8.0 에서 `CUBE` 는 **예약어**라 CTE 이름으로 쓸 수 없습니다 (그래서 `cubed`).

- id: SQLD-017
  title: GROUPING SETS 흉내내기
  level: 3
  tags: [GROUPING SETS, UNION ALL]
  question: |
    `GROUPING SETS ((rating), (rental_rate))` 와 같은 결과를 만드세요. 등급별 영화 수와 대여료별 영화 수를 **한 결과**에 담습니다.

    - 출력: `rating`(대여료 그룹 행에서는 NULL), `rental_rate`(등급 그룹 행에서는 NULL), `films`
    - 등급 그룹이 먼저(등급 순), 그다음 대여료 그룹(대여료 순)

    **사용 테이블:** `film`
  solution: |
    SELECT rating, NULL AS rental_rate, COUNT(*) AS films
    FROM film GROUP BY rating
    UNION ALL
    SELECT NULL, rental_rate, COUNT(*)
    FROM film GROUP BY rental_rate
    ORDER BY rating IS NULL, rating, rental_rate;
  note: |
    `GROUPING SETS` 는 **나열한 그룹만** 따로 집계해 합친 것입니다 (ROLLUP 과 달리 총계가 자동으로 생기지 않음, `()` 를 넣어야 총계).
    `GROUPING SETS ((a), (b))` = `GROUP BY a UNION ALL GROUP BY b`. 인자 순서가 바뀌어도 결과 집합은 같다는 것도 시험 포인트입니다.

- id: SQLD-018
  title: RATIO_TO_REPORT
  level: 2
  tags: [RATIO_TO_REPORT, SUM OVER, 비율]
  question: |
    고객 1번의 결제마다 **고객 전체 결제액 대비 비율**을 구하세요. (Oracle 의 `RATIO_TO_REPORT(amount) OVER ()`)

    - 출력: `payment_id`, `amount`, `ratio`(소수 4자리) — `payment_id` 순

    **사용 테이블:** `payment`
  solution: |
    SELECT payment_id, amount,
           ROUND(amount / SUM(amount) OVER (), 4) AS ratio
    FROM payment
    WHERE customer_id = 1
    ORDER BY payment_id;
  note: |
    `RATIO_TO_REPORT(x) OVER (PARTITION BY ...)` = `x / SUM(x) OVER (PARTITION BY ...)`. 결과의 합은 항상 1 입니다.
    SQLD 의 **비율 함수** 네 가지: `RATIO_TO_REPORT`, `PERCENT_RANK`, `CUME_DIST`, `NTILE` — 정의를 구분해 두세요 (WIN-015, WIN-016 참고).

- id: SQLD-019
  title: 윈도우 프레임 ROWS vs RANGE
  level: 3
  tags: [ROWS, RANGE, 윈도우 프레임, 동점]
  question: |
    `film_id` 1~12번 영화를 대여료 순으로 정렬해 대여료 누적합을 두 가지 프레임으로 구하세요.

    - `rows_sum`: `ORDER BY rental_rate, film_id` + `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`
    - `range_sum`: `ORDER BY rental_rate` (동점 그대로) + `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`

    출력: `film_id`, `rental_rate`, `rows_sum`, `range_sum` — `rental_rate`, `film_id` 순

    **사용 테이블:** `film`
  solution: |
    SELECT film_id, rental_rate, rows_sum, range_sum
    FROM (
        SELECT film_id, rental_rate,
               SUM(rental_rate) OVER (ORDER BY rental_rate, film_id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS rows_sum,
               SUM(rental_rate) OVER (ORDER BY rental_rate RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS range_sum
        FROM film
        WHERE film_id <= 12
    ) t
    ORDER BY rental_rate, film_id;
  note: |
    `RANGE` 는 정렬 값이 **같은 행들을 한 묶음**으로 보므로 동점 행들의 누적합이 모두 같습니다. `ROWS` 는 물리적 행 하나씩 더합니다.
    **SQLD 빈출**: `ORDER BY` 만 쓰고 프레임을 생략하면 기본값은 `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` 입니다.
    ROWS 쪽에 `film_id` 를 추가한 이유: 동점 안에서 어느 행을 먼저 더할지는 DB 마음이라, 정렬 키를 끝까지 정해야 결과가 매번 같습니다.

- id: SQLD-020
  title: LAG 의 오프셋과 기본값
  level: 2
  tags: [LAG, LEAD, 기본값]
  question: |
    고객 1번의 결제를 결제일 순으로 나열하고, **2건 전** 결제 금액(없으면 0)과 **다음** 결제 금액(없으면 NULL)을 구하세요.

    - 출력: `payment_id`, `amount`, `amount_2_before`, `next_amount` — `payment_date`, `payment_id` 순

    **사용 테이블:** `payment`
  solution: |
    SELECT payment_id, amount,
           LAG(amount, 2, 0) OVER w AS amount_2_before,
           LEAD(amount)      OVER w AS next_amount
    FROM payment
    WHERE customer_id = 1
    WINDOW w AS (ORDER BY payment_date, payment_id)
    ORDER BY payment_date, payment_id;
  note: |
    `LAG(컬럼, 오프셋, 기본값)` — 오프셋 기본은 1, 기본값을 생략하면 NULL. 처음 두 행은 2건 전이 없어 0 이 됩니다.
    Oracle 은 `LAG(x, 2, 0) IGNORE NULLS` 처럼 NULL 건너뛰기 옵션도 있지만 MySQL 은 지원하지 않습니다.

- id: SQLD-021
  title: EMP 셀프 조인 - 사원과 관리자
  level: 2
  tags: [SELF JOIN, EMP, OUTER JOIN]
  question: |
    SQLD 단골 테이블 `EMP` 를 CTE 로 만들어 사용합니다. 아래 CTE 를 그대로 복사해 쿼리 앞에 붙이세요.

    ```sql
    WITH emp(empno, ename, job, mgr, sal, deptno) AS (
        SELECT 7839,'KING','PRESIDENT',NULL,5000,10 UNION ALL SELECT 7566,'JONES','MANAGER',7839,2975,20
        UNION ALL SELECT 7698,'BLAKE','MANAGER',7839,2850,30 UNION ALL SELECT 7782,'CLARK','MANAGER',7839,2450,10
        UNION ALL SELECT 7788,'SCOTT','ANALYST',7566,3000,20 UNION ALL SELECT 7902,'FORD','ANALYST',7566,3000,20
        UNION ALL SELECT 7369,'SMITH','CLERK',7902,800,20 UNION ALL SELECT 7499,'ALLEN','SALESMAN',7698,1600,30
        UNION ALL SELECT 7521,'WARD','SALESMAN',7698,1250,30 UNION ALL SELECT 7654,'MARTIN','SALESMAN',7698,1250,30
        UNION ALL SELECT 7844,'TURNER','SALESMAN',7698,1500,30 UNION ALL SELECT 7900,'JAMES','CLERK',7698,950,30
        UNION ALL SELECT 7876,'ADAMS','CLERK',7788,1100,20 UNION ALL SELECT 7934,'MILLER','CLERK',7782,1300,10
    )
    ```

    모든 사원의 이름 `ename`, 관리자 이름 `manager`(없으면 NULL), **관리자보다 급여가 많거나 같은지** `ge_manager`(1/0, 관리자가 없으면 NULL) 를 구하세요.
    `empno` 순.
  solution: |
    WITH emp(empno, ename, job, mgr, sal, deptno) AS (
        SELECT 7839,'KING','PRESIDENT',NULL,5000,10 UNION ALL SELECT 7566,'JONES','MANAGER',7839,2975,20
        UNION ALL SELECT 7698,'BLAKE','MANAGER',7839,2850,30 UNION ALL SELECT 7782,'CLARK','MANAGER',7839,2450,10
        UNION ALL SELECT 7788,'SCOTT','ANALYST',7566,3000,20 UNION ALL SELECT 7902,'FORD','ANALYST',7566,3000,20
        UNION ALL SELECT 7369,'SMITH','CLERK',7902,800,20 UNION ALL SELECT 7499,'ALLEN','SALESMAN',7698,1600,30
        UNION ALL SELECT 7521,'WARD','SALESMAN',7698,1250,30 UNION ALL SELECT 7654,'MARTIN','SALESMAN',7698,1250,30
        UNION ALL SELECT 7844,'TURNER','SALESMAN',7698,1500,30 UNION ALL SELECT 7900,'JAMES','CLERK',7698,950,30
        UNION ALL SELECT 7876,'ADAMS','CLERK',7788,1100,20 UNION ALL SELECT 7934,'MILLER','CLERK',7782,1300,10
    )
    SELECT e.ename, m.ename AS manager, e.sal >= m.sal AS ge_manager
    FROM emp e
    LEFT JOIN emp m ON m.empno = e.mgr
    ORDER BY e.empno;
  note: |
    사원 테이블의 `mgr` 이 같은 테이블의 `empno` 를 가리키는 **자기 참조** 구조입니다. KING 은 관리자가 없으므로 INNER JOIN 이면 빠집니다 → LEFT JOIN.
    SCOTT·FORD(3000) 는 관리자 JONES(2975) 보다 급여가 많습니다. 시험에서는 "관리자보다 급여가 많은 사원" 문제가 단골입니다.

- id: SQLD-022
  title: EMP 계층형 질의 (CONNECT BY → 재귀 CTE)
  level: 4
  tags: [계층형 질의, CONNECT BY, 재귀 CTE, LEVEL]
  question: |
    SQLD-021 의 `emp` CTE 를 사용해 Oracle 의 아래 계층형 질의와 같은 결과를 만드세요.

    ```sql
    SELECT LEVEL, LPAD(' ', 4 * (LEVEL - 1)) || ename AS tree,
           SYS_CONNECT_BY_PATH(ename, '/') AS path, CONNECT_BY_ISLEAF AS is_leaf
    FROM emp
    START WITH mgr IS NULL
    CONNECT BY PRIOR empno = mgr
    ORDER SIBLINGS BY ename;
    ```

    - 출력: `lvl`, `tree`, `path`, `is_leaf` — 형제끼리 이름순인 **깊이 우선** 순서 (`path` 순으로 정렬하면 됩니다)
  solution: |
    WITH RECURSIVE emp(empno, ename, job, mgr, sal, deptno) AS (
        SELECT 7839,'KING','PRESIDENT',NULL,5000,10 UNION ALL SELECT 7566,'JONES','MANAGER',7839,2975,20
        UNION ALL SELECT 7698,'BLAKE','MANAGER',7839,2850,30 UNION ALL SELECT 7782,'CLARK','MANAGER',7839,2450,10
        UNION ALL SELECT 7788,'SCOTT','ANALYST',7566,3000,20 UNION ALL SELECT 7902,'FORD','ANALYST',7566,3000,20
        UNION ALL SELECT 7369,'SMITH','CLERK',7902,800,20 UNION ALL SELECT 7499,'ALLEN','SALESMAN',7698,1600,30
        UNION ALL SELECT 7521,'WARD','SALESMAN',7698,1250,30 UNION ALL SELECT 7654,'MARTIN','SALESMAN',7698,1250,30
        UNION ALL SELECT 7844,'TURNER','SALESMAN',7698,1500,30 UNION ALL SELECT 7900,'JAMES','CLERK',7698,950,30
        UNION ALL SELECT 7876,'ADAMS','CLERK',7788,1100,20 UNION ALL SELECT 7934,'MILLER','CLERK',7782,1300,10
    ), tree AS (
        SELECT empno, ename, 1 AS lvl, CAST(CONCAT('/', ename) AS CHAR(500)) AS path
        FROM emp WHERE mgr IS NULL
        UNION ALL
        SELECT e.empno, e.ename, t.lvl + 1, CONCAT(t.path, '/', e.ename)
        FROM tree t JOIN emp e ON e.mgr = t.empno
    )
    SELECT t.lvl,
           CONCAT(REPEAT(' ', 4 * (t.lvl - 1)), t.ename) AS tree,
           t.path,
           NOT EXISTS (SELECT 1 FROM emp c WHERE c.mgr = t.empno) AS is_leaf
    FROM tree t
    ORDER BY t.path;
  note: |
    | Oracle | MySQL 재귀 CTE |
    |---|---|
    | `START WITH mgr IS NULL` | 앵커 쿼리의 WHERE |
    | `CONNECT BY PRIOR empno = mgr` | 재귀 조인 `e.mgr = t.empno` (부모 → 자식 = **순방향**) |
    | `LEVEL` | 재귀마다 +1 하는 컬럼 |
    | `SYS_CONNECT_BY_PATH` | 경로 문자열 누적 |
    | `CONNECT_BY_ISLEAF` | 자식이 없는지 `NOT EXISTS` |
    | `ORDER SIBLINGS BY` | 경로 문자열 정렬 (이름 길이가 다르면 정확하지 않을 수 있음) |
    **SQLD 빈출**: `PRIOR` 가 붙은 쪽이 부모입니다. `CONNECT BY PRIOR mgr = empno` 로 바꾸면 **역방향**(자식 → 부모)으로 올라갑니다.

- id: SQLD-023
  title: EMP 부서별 급여 순위
  level: 2
  tags: [RANK, DENSE_RANK, PARTITION BY, EMP]
  question: |
    SQLD-021 의 `emp` CTE 를 사용해 부서별 급여 순위를 구하세요.

    - 출력: `deptno`, `ename`, `sal`, `rnk`(RANK), `dense_rnk`(DENSE_RANK), `dept_max`(부서 최고 급여)
    - 정렬: `deptno`, `sal` 내림차순, `ename` 순
  solution: |
    WITH emp(empno, ename, job, mgr, sal, deptno) AS (
        SELECT 7839,'KING','PRESIDENT',NULL,5000,10 UNION ALL SELECT 7566,'JONES','MANAGER',7839,2975,20
        UNION ALL SELECT 7698,'BLAKE','MANAGER',7839,2850,30 UNION ALL SELECT 7782,'CLARK','MANAGER',7839,2450,10
        UNION ALL SELECT 7788,'SCOTT','ANALYST',7566,3000,20 UNION ALL SELECT 7902,'FORD','ANALYST',7566,3000,20
        UNION ALL SELECT 7369,'SMITH','CLERK',7902,800,20 UNION ALL SELECT 7499,'ALLEN','SALESMAN',7698,1600,30
        UNION ALL SELECT 7521,'WARD','SALESMAN',7698,1250,30 UNION ALL SELECT 7654,'MARTIN','SALESMAN',7698,1250,30
        UNION ALL SELECT 7844,'TURNER','SALESMAN',7698,1500,30 UNION ALL SELECT 7900,'JAMES','CLERK',7698,950,30
        UNION ALL SELECT 7876,'ADAMS','CLERK',7788,1100,20 UNION ALL SELECT 7934,'MILLER','CLERK',7782,1300,10
    )
    SELECT deptno, ename, sal,
           RANK()       OVER (PARTITION BY deptno ORDER BY sal DESC) AS rnk,
           DENSE_RANK() OVER (PARTITION BY deptno ORDER BY sal DESC) AS dense_rnk,
           MAX(sal)     OVER (PARTITION BY deptno) AS dept_max
    FROM emp
    ORDER BY deptno, sal DESC, ename;
  note: |
    20번 부서의 SCOTT·FORD(3000) 공동 1위 다음 JONES 는 RANK 3위, DENSE_RANK 2위 — 시험에서 결과표를 고르는 단골 문제입니다.
    30번 부서의 WARD·MARTIN(1250) 동점도 같은 방식으로 확인해 보세요.

- id: SQLD-024
  title: 집계 함수 중첩 (MAX(COUNT(*)))
  level: 2
  tags: [집계 중첩, 인라인 뷰]
  question: |
    등급별 영화 수 중 **가장 큰 값**을 구하세요. Oracle 에서는 `SELECT MAX(COUNT(*)) FROM film GROUP BY rating` 이 가능하지만 MySQL 은 불가능합니다.

    - 출력: `max_films`

    **사용 테이블:** `film`
  solution: |
    SELECT MAX(films) AS max_films
    FROM (SELECT rating, COUNT(*) AS films FROM film GROUP BY rating) t;
  note: |
    Oracle 은 GROUP BY 가 있을 때 집계 함수를 **한 번** 중첩할 수 있습니다(`MAX(COUNT(*))`). MySQL·표준 SQL 은 인라인 뷰로 감싸야 합니다.
    중첩 집계의 결과는 1행이므로, SELECT 목록에 `rating` 같은 그룹 컬럼을 함께 쓸 수 없다는 것도 시험 포인트입니다.

- id: SQLD-025
  title: 정규 표현식 함수
  level: 2
  tags: [REGEXP_SUBSTR, REGEXP_REPLACE, 정규식]
  question: |
    주소(`address`)의 맨 앞 번지수를 `REGEXP_SUBSTR` 로 뽑아 `house_no` 로, 번지수와 공백을 제거한 도로명을 `REGEXP_REPLACE` 로 만들어 `street` 로 출력하세요.
    `address_id` 1~10번, `address_id` 순.

    - 출력: `address_id`, `address`, `house_no`, `street`

    **사용 테이블:** `address`
  solution: |
    SELECT address_id, address,
           REGEXP_SUBSTR(address, '^[0-9]+') AS house_no,
           REGEXP_REPLACE(address, '^[0-9]+ +', '') AS street
    FROM address
    WHERE address_id <= 10
    ORDER BY address_id;
  note: |
    `REGEXP_SUBSTR`, `REGEXP_REPLACE`, `REGEXP_INSTR`, `REGEXP_LIKE` 는 Oracle 과 MySQL 8.0 모두 지원하며 SQLD 출제 범위에 들어갔습니다.
    `^` 시작, `[0-9]+` 숫자 1개 이상, ` +` 공백 1개 이상. 번지수가 없는 주소에서는 `house_no` 가 NULL 이 됩니다.

- id: SQLD-026
  title: 논리 연산자 우선순위 (NOT > AND > OR)
  level: 2
  tags: [NOT, AND, OR, 우선순위]
  question: |
    다음 조건의 결과 행 수를 각각 구해 한 행으로 출력하세요. (`film` 테이블)

    - `a`: `NOT rating = 'G' AND rental_rate = 0.99`
    - `b`: `NOT (rating = 'G' AND rental_rate = 0.99)`
    - `c`: `rating = 'G' OR rating = 'PG' AND rental_rate = 0.99`
    - `d`: `(rating = 'G' OR rating = 'PG') AND rental_rate = 0.99`

    **사용 테이블:** `film`
  solution: |
    SELECT
      (SELECT COUNT(*) FROM film WHERE NOT rating = 'G' AND rental_rate = 0.99)                 AS a,
      (SELECT COUNT(*) FROM film WHERE NOT (rating = 'G' AND rental_rate = 0.99))               AS b,
      (SELECT COUNT(*) FROM film WHERE rating = 'G' OR rating = 'PG' AND rental_rate = 0.99)    AS c,
      (SELECT COUNT(*) FROM film WHERE (rating = 'G' OR rating = 'PG') AND rental_rate = 0.99)  AS d;
  note: |
    우선순위는 **NOT → AND → OR**. `a` 는 `(NOT rating='G') AND ...`, `c` 는 `rating='G' OR (rating='PG' AND ...)` 로 해석됩니다.
    a 와 b, c 와 d 의 차이가 곧 괄호의 효과입니다. 시험에서는 "결과 건수가 다른 것은?" 형식으로 자주 출제됩니다.
